<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Central de Estudos</title>
<script>try { const t = localStorage.getItem("central-estudos-tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) { }</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra lateral fixa no desktop + área de trabalho em cards brancos sobre lavanda; no celular, barra inferior de navegação */
:root{
  --pink:#FF69B4; --pink-ink:#C7337F; --pink-soft:#FFE3F1;
  --lav:#E6E6FA; --lav-deep:#D4D2F2; --white:#FFFFFF;
  --ink:#2D2438; --ink-2:#5E5470; --ink-3:#8E86A0;
  --line:#ECEAF3; --field:#F6F5FA;
  --ok:#2E9E6B; --ok-soft:#E1F4EA; --warn:#C98A12; --warn-soft:#FBF0D9; --bad:#D2455B; --bad-soft:#FBE3E7;
  --shadow:0 1px 2px rgba(45,36,56,.06),0 6px 20px rgba(45,36,56,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-s:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pink:#FF7DBF; --pink-ink:#FF9ACD; --pink-soft:#4A2440;
  --lav:#1C1726; --lav-deep:#2A2338; --white:#26202F;
  --ink:#F1ECF8; --ink-2:#C2B9D2; --ink-3:#8F86A0;
  --line:#352D42; --field:#2E2739;
  --ok:#5CC995; --ok-soft:#1E3A2E; --warn:#E5B04A; --warn-soft:#3D3120; --bad:#F07A8C; --bad-soft:#45222A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --pink:#FF7DBF; --pink-ink:#FF9ACD; --pink-soft:#4A2440;
  --lav:#1C1726; --lav-deep:#2A2338; --white:#26202F;
  --ink:#F1ECF8; --ink-2:#C2B9D2; --ink-3:#8F86A0;
  --line:#352D42; --field:#2E2739;
  --ok:#5CC995; --ok-soft:#1E3A2E; --warn:#E5B04A; --warn-soft:#3D3120; --bad:#F07A8C; --bad-soft:#45222A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--lav);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink-ink)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--lav-deep);padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pink);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:800;line-height:1.1}
.brand small{display:block;color:var(--ink-3);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--white)}
.nav button[aria-current="page"]{background:var(--white);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--pink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--pink);color:#fff;border-radius:99px;padding:0 7px;font-family:var(--f-mono)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--ink-3);padding:0 8px;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--lav);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--lav-deep)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lav)}
.top .week-pill{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:99px;padding:6px 14px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem}
.top .week-pill i{width:8px;height:8px;border-radius:50%;background:var(--pink);display:block}
.top .overall{display:flex;align-items:center;gap:10px;flex:1;min-width:180px;max-width:360px}
.top .overall .bar{flex:1}
.top .overall span{font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.top .spacer{flex:1}
.mob-brand{display:none}
.theme-btn{flex:none}
.content{padding-block:24px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.foot{margin-top:auto;padding:16px 24px;font-size:.78rem;color:var(--ink-3);border-top:1px solid var(--lav-deep);display:flex;gap:8px;align-items:center}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--pink);display:block}

.bottomnav{display:none}

/* elements */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{color:var(--ink-3);font-size:.85rem}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:60ch}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink);font-weight:700}

/* ajuda das abas: botão "Entenda esta aba" ao lado do rótulo; abre ao passar o mouse, com foco do teclado ou com toque */
.eyebrow-row{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.help-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 4px;border-radius:99px;background:var(--white);box-shadow:var(--shadow);font-size:.75rem;font-weight:600;color:var(--ink-2);line-height:1.5}
.help-btn svg{width:16px;height:16px;color:var(--pink)}
.help-btn:hover,.help.open .help-btn{color:var(--ink)}
.help-btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.help-pop{position:absolute;left:0;top:calc(100% + 8px);z-index:4;width:min(420px,calc(100vw - 32px));background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(45,36,56,.18);padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s .1s,transform .15s .1s,visibility 0s linear .25s}
.help-pop::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.help-pop .eyebrow{margin-top:4px}
.help-pop .eyebrow:first-child{margin-top:0}
.help-pop p{color:var(--ink-2)}
.help-pop ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.help-pop .help-tip{margin-top:6px;background:var(--pink-soft);color:var(--ink);border-radius:var(--r-s);padding:8px 10px}
.help-pop .help-tip b{color:var(--pink-ink)}
@media (hover:hover){.help:not(.shut):hover .help-pop{opacity:1;visibility:visible;transform:none;transition-delay:0s}}
.help:not(.shut) .help-btn:focus-visible + .help-pop,.help.open .help-pop{opacity:1;visibility:visible;transform:none;transition-delay:0s}
@media (prefers-reduced-motion:reduce){.help-pop{transform:none}}

/* login (site publicado com dados na nuvem) */
.login{max-width:420px;width:100%;margin:32px auto 0;display:flex;flex-direction:column;gap:16px}
.linkbtn{all:unset;cursor:pointer;color:var(--pink-ink);font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@media (max-width:860px){.help-pop{scroll-margin-bottom:96px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--ink-3)}
.small{font-size:.84rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:600;background:var(--field);color:var(--ink);transition:transform .12s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary:hover{background:var(--pink-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.84rem;border-radius:9px}
.btn svg{width:16px;height:16px}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.icon-btn:hover{background:var(--field)}
.icon-btn svg{width:17px;height:17px}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--field);color:var(--ink-2);white-space:nowrap}
.chip.pend{background:var(--field);color:var(--ink-2)}
.chip.and{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pink{background:var(--pink-soft);color:var(--pink-ink)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--white);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi label{font-size:.75rem;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:.78rem;color:var(--ink-2)}
.kpi.lead{grid-column:span 2;background:var(--ink);color:var(--white)}
.kpi.lead label{color:var(--lav-deep)}
.kpi.lead b{font-size:2.4rem}
.kpi.lead small{color:var(--lav-deep)}
.kpi.lead .bar{background:rgba(255,255,255,.15);margin-top:6px}
:root[data-theme="dark"] .kpi.lead{background:var(--pink-soft);color:var(--ink)}
:root[data-theme="dark"] .kpi.lead label,:root[data-theme="dark"] .kpi.lead small{color:var(--ink-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.lead{background:var(--pink-soft);color:var(--ink)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.lead label,:root:not([data-theme="light"]) .kpi.lead small{color:var(--ink-2)}}

/* Content rows + animated check */
.subj{display:flex;flex-direction:column;gap:2px}
.subj-h{display:flex;align-items:center;gap:8px;padding:12px 4px 6px;font-weight:700;font-size:.85rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.subj-h .dot{width:9px;height:9px;border-radius:3px;background:var(--pink)}
.citem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 10px;border-radius:12px;transition:background .2s}
.citem:hover{background:var(--field)}
.citem .ttl{font-weight:600;cursor:pointer;min-width:0}
.citem .ttl:hover{color:var(--pink-ink)}
.citem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:.78rem;color:var(--ink-3);align-items:center}
.citem .meta span{display:inline-flex;align-items:center;gap:4px}
.citem .meta svg{width:13px;height:13px}
.citem.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.citem .right{display:flex;align-items:center;gap:6px}

.check{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.check svg{width:30px;height:30px;overflow:visible}
.check .ring{fill:none;stroke:var(--ink-3);stroke-width:2;transition:stroke .2s}
.check .fill{fill:var(--pink);transform-origin:15px 15px;transform:scale(0);transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.check .tick{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s ease .18s}
.check:hover .ring{stroke:var(--pink)}
.check.on .ring{stroke:var(--pink)}
.check.on .fill{transform:scale(1)}
.check.on .tick{stroke-dashoffset:0}
.check.pop::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pink);animation:ring .55s ease-out forwards}
@keyframes ring{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.35)}}
.check.no-anim .fill,.check.no-anim .tick{transition:none}
@media (prefers-reduced-motion:reduce){.check .fill,.check .tick,.bar>i{transition:none}.check.pop::after{animation:none}}

/* week tabs */
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.wtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.wtab{all:unset;cursor:pointer;flex:none;background:var(--white);border-radius:12px;padding:8px 14px;min-width:110px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border:2px solid transparent}
.wtab b{font-size:.88rem}
.wtab small{font-size:.72rem;color:var(--ink-3)}
.wtab .bar{height:4px}
.wtab[aria-selected="true"]{border-color:var(--pink)}
.wtab.now b::after{content:" · atual";color:var(--pink-ink);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);outline:none;transition:border .15s,background .15s}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--pink);background:var(--white)}
.fld .hint{font-size:.75rem;color:var(--ink-3)}
.fld .err{font-size:.75rem;color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.toggle input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--pink)}
.toggle input:checked::after{transform:translateX(16px)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{min-height:38px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:.88rem;max-width:100%}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(45,36,56,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--white);z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(45,36,56,.15);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1;min-width:0}
.drawer-b{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.drawer-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sect{display:flex;flex-direction:column;gap:10px}
.sect > h3{display:flex;align-items:center;gap:8px;font-size:.92rem}
.sect > h3 svg{width:16px;height:16px;color:var(--pink)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(420px,calc(100% - 32px));background:var(--white);border-radius:var(--r);z-index:51;padding:22px;box-shadow:0 20px 60px rgba(45,36,56,.3);opacity:0;pointer-events:none;transition:all .2s;display:flex;flex-direction:column;gap:14px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mscrim{z-index:50}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:12px;z-index:60;opacity:0;transition:all .25s;font-weight:500;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.mat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.mat .ico{width:34px;height:34px;border-radius:9px;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;flex:none;font-size:.62rem;font-weight:800;font-family:var(--f-mono)}
.mat .info{flex:1;min-width:0}
.mat .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.mat .info small{color:var(--ink-3);font-size:.75rem}

.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .art{width:64px;height:64px;border-radius:20px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.empty .art svg{width:30px;height:30px}
.empty p{color:var(--ink-2);max-width:46ch}

.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--pink-soft);color:var(--ink);font-size:.88rem;flex-wrap:wrap}
.banner b{color:var(--pink-ink)}

/* ================= cálculos ================= */
const weeks = () => all("week").sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
const contents = () => all("content").sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
const contentsOf = wid => contents().filter(c => c.weekId === wid);
const sessions = () => all("session").sort((a, b) => (a.data + (a.inicio || "")).localeCompare(b.data + (b.inicio || "")));
const errors = () => all("error").sort((a, b) => (b.data || "").localeCompare(a.data || ""));
const reviews = () => all("review").sort((a, b) => (a.prevista || "").localeCompare(b.prevista || ""));
const materials = () => all("material");
const closingOf = wid => all("closing").find(c => c.weekId === wid);
const reminders = () => all("reminder").sort((a, b) => (a.data || "").localeCompare(b.data || ""));
const remindersDue = () => reminders().filter(r => !r.feito && r.data && r.data <= TODAY()).length;

function sessionMin(s) {
  if (s.minutosManuais != null && s.minutosManuais !== "") return Math.max(0, +s.minutosManuais);
  const a = toMin(s.inicio), b = toMin(s.fim);
  if (a == null || b == null) return 0;
  let m = b - a; if (m < 0) m += 1440;
  m -= (+s.pausasMin || 0);
  if (s.almoco) m -= (+settings().almocoMin || 0);
  return Math.max(0, m);
}
function weekOfDate(d) { return weeks().find(w => w.inicio && w.fim && w.inicio <= d && d <= w.fim); }
function sessionWeek(s) {
  if (s.contentId && get(s.contentId)) return get(s.contentId).weekId;
  const w = weekOfDate(s.data); return w ? w.id : null;
}
const contentMin = cid => sessions().filter(s => s.contentId === cid).reduce((t, s) => t + sessionMin(s), 0);
function weekStats(wid) {
  const cs = contentsOf(wid);
  const done = cs.filter(c => c.status === "concluido").length;
  const and = cs.filter(c => c.status === "andamento").length;
  const min = sessions().filter(s => sessionWeek(s) === wid).reduce((t, s) => t + sessionMin(s), 0);
  const qr = cs.reduce((t, c) => t + (+c.qResolvidas || 0), 0);
  const qc = cs.reduce((t, c) => t + (+c.qCorretas || 0), 0);
  const w = get(wid) || {};
  const meta = (+w.metaHoras || 0) * 60;
  const errs = errors().filter(e => e.contentId && get(e.contentId) && get(e.contentId).weekId === wid);
  return { total: cs.length, done, and, pend: cs.length - done - and, pct: cs.length ? done / cs.length * 100 : 0, min, meta, qr, qc, acc: pct1(qc, qr), errs };
}
function overall() {
  const cs = contents();
  const done = cs.filter(c => c.status === "concluido").length;
  const and = cs.filter(c => c.status === "andamento").length;
  const min = sessions().reduce((t, s) => t + sessionMin(s), 0);
  const meta = weeks().reduce((t, w) => t + (+w.metaHoras || 0) * 60, 0);
  const qr = cs.reduce((t, c) => t + (+c.qResolvidas || 0), 0);
  const qc = cs.reduce((t, c) => t + (+c.qCorretas || 0), 0);
  return { total: cs.length, done, and, pend: cs.length - done - and, pct: cs.length ? done / cs.length * 100 : 0, min, meta, qr, qc, acc: pct1(qc, qr) };
}
function currentWeek() {
  const t = TODAY(); const ws = weeks();
  return ws.find(w => w.inicio && w.fim && w.inicio <= t && t <= w.fim) || ws.find(w => weekStats(w.id).pct < 100) || ws[ws.length - 1];
}
const disciplinas = () => [...new Set(contents().map(c => c.disciplina).concat(errors().map(e => e.disciplina)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
function bySubject() {
  const m = {};
  contents().forEach(c => {
    const k = (c.disciplina || "—") + "||" + (c.assunto || "—");
    m[k] = m[k] || { disciplina: c.disciplina || "—", assunto: c.assunto || "—", qr: 0, qc: 0, erros: 0, revisoes: 0 };
    m[k].qr += +c.qResolvidas || 0; m[k].qc += +c.qCorretas || 0;
  });
  errors().forEach(e => { const k = (e.disciplina || "—") + "||" + (e.assunto || "—"); m[k] = m[k] || { disciplina: e.disciplina || "—", assunto: e.assunto || "—", qr: 0, qc: 0, erros: 0, revisoes: 0 }; m[k].erros++; });
  reviews().forEach(r => { const k = (r.disciplina || "—") + "||" + (r.assunto || "—"); if (m[k]) m[k].revisoes++; });
  return Object.values(m);
}
function reinforce() {
  return bySubject().filter(s => (s.qr >= 5 && s.qc / s.qr < .7) || s.erros >= 2)
    .sort((a, b) => (b.erros - a.erros) || ((a.qr ? a.qc / a.qr : 1) - (b.qr ? b.qc / b.qr : 1))).slice(0, 6);
}

/* ---- gráficos SVG ---- */
function barChart(labels, values, { fmt = v => v, target = null, h = 180 } = {}) {
  if (!values.length) return "";
  const W = 560, H = h, L = 36, B = 24, T = 10, R = 8;
  const max = Math.max(1, ...values, ...(target ? target : [0])) * 1.1;
  const bw = (W - L - R) / values.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = max / 1.1 * i / 3; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; }
  values.forEach((v, i) => {
    const x = L + i * bw + bw * .2, w = bw * .6;
    g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, H - B - y(v))}" rx="4" fill="var(--pink)"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if (target && target[i]) g += `<line x1="${x - 3}" x2="${x + w + 3}" y1="${y(target[i])}" y2="${y(target[i])}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(labels, values, { h = 180 } = {}) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (!pts.length) return `<p class="muted small" style="padding:40px 0;text-align:center">Registre questões para ver a evolução.</p>`;
  const W = 560, H = h, L = 36, B = 24, T = 12, R = 14;
  const x = i => L + (labels.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / 100);
  let g = "";
  [0, 50, 70, 100].forEach(v => g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" ${v === 70 ? 'stroke-dasharray="4 3"' : ""}/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`);
  const d = pts.map((p, i) => (i ? "L" : "M") + x(p[0]) + " " + y(p[1])).join(" ");
  g += `<path d="${d} L${x(pts[pts.length - 1][0])} ${H - B} L${x(pts[0][0])} ${H - B}Z" fill="var(--pink)" opacity=".12"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? "var(--pink)" : "var(--white)"}" stroke="var(--pink)" stroke-width="2"><title>${esc(labels[p[0]])}: ${fmtPct(p[1])}</title></circle>`);
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

const helpHTML = r => { const h = HELP[r]; return `<div class="help"><button type="button" class="help-btn" aria-describedby="help-${r}">${ic("q")}<span>Entenda esta aba</span></button>
  <div class="help-pop" id="help-${r}" role="tooltip"><span class="eyebrow">Para que serve</span><p>${h.serve}</p><span class="eyebrow">O que fazer aqui</span><ol>${h.fazer.map(f => `<li>${f}</li>`).join("")}</ol><p class="help-tip"><b>Dica:</b> ${h.dica}</p></div></div>`; };
// toque/clique abre e fecha (no celular não há "passar o mouse"); clicar fora fecha; Esc esconde até o ponteiro ou o foco sair
document.addEventListener("click", e => {
  const h = e.target.closest(".help");
  document.querySelectorAll(".help.open").forEach(x => x !== h && x.classList.remove("open"));
  if (h && e.target.closest(".help-btn")) {
    h.classList.remove("shut");
    const pop = h.querySelector(".help-pop");
    if (h.classList.toggle("open") && pop.getBoundingClientRect().bottom > innerHeight) pop.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".help").forEach(x => { x.classList.remove("open"); x.classList.add("shut"); }); });
document.addEventListener("mouseover", e => { if (!e.target.closest(".help")) document.querySelectorAll(".help.shut").forEach(x => x.classList.remove("shut")); });
document.addEventListener("focusout", e => { const h = e.target.closest && e.target.closest(".help"); if (h) h.classList.remove("shut"); });

/* ================= render ================= */
function render() {
  if (animLock) return;
  $("#nav").innerHTML = navHTML(VIEWS);
  const bn = [["visao", "Início", "home"], ["semanas", "Semanas", "weeks"], ["erros", "Erros", "err"], ["revisoes", "Revisões", "rev"]];
  $("#bnav").innerHTML = navHTML(bn) + `<button id="moreBtn" ${bn.some(b => b[0] === route) ? "" : 'aria-current="page"'}>${ic("more")}<span>Mais</span></button>`;
  $("#moreBtn").onclick = () => { $("#sheetNav").innerHTML = navHTML(VIEWS) + (S.user ? `<button data-act="logout">${ic("out")}<span>Sair</span></button>` : ""); $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); };
  const o = overall(); const cw = currentWeek();
  $("#ovBar").style.width = o.pct + "%";
  $("#ovTxt").textContent = `${Math.round(o.pct)}% do plano · ${o.done}/${o.total}`;
  $("#weekPill").innerHTML = `<i></i><span>${cw ? esc(cw.nome) + (cw.inicio ? ` · ${fmtD(cw.inicio)}–${fmtD(cw.fim)}` : "") : "Nenhuma semana cadastrada"}</span>`;
  $("#weekPill").style.cursor = cw ? "pointer" : "";
  $("#weekPill").onclick = () => cw && go("semanas", { week: cw.id });
  const modeTxt = { db: "Salvo na nuvem · disponível em qualquer dispositivo", local: "Modo local · salvo só neste navegador", login: "Entre para ver seus registros", offline: "Sem conexão com a nuvem" }[S.mode] || "Conectando…";
  $("#footTxt").textContent = modeTxt;
  $("#sideFoot").innerHTML = `<span>${modeTxt}</span>` + (S.user ? `<span>${esc(S.user.email)} · <button class="linkbtn" data-act="logout">Sair</button></span>` : "");
  if (S.mode === "login") { $("#view").innerHTML = loginView(); bindLogin(); return; }
  if (S.mode === "offline") { $("#view").innerHTML = `<div class="card">${empty("spark", "Não consegui abrir seus registros", "A conexão com a nuvem falhou. Verifique a internet e tente de novo.", `<button class="btn primary" data-act="cloud-retry">Tentar de novo</button>`)}</div>`; return; }
  if (!S.ready) { $("#view").innerHTML = `<div class="card">${empty("spark", "Abrindo sua central", "Buscando seus registros…")}</div>`; return; }
  const pend = localPending().length;
  const v = { visao: vVisao, crono: vCrono, semanas: vSemanas, erros: vErros, revisoes: vRevisoes, desempenho: vDesempenho, horas: vHoras, biblioteca: vBiblioteca, mapas: vMapas, fechamentos: vFechamentos, lembretes: vLembretes }[route];
  const pl = settings().plano; $(".side .brand small").textContent = pl ? "Prefeitura de Curitiba" : "Concurso público";
  $("#view").innerHTML = (S.mode === "local" ? localBanner() : "") + (pend ? sendBanner(pend) : "") + (!settings().planoImportado && !pend ? planBanner() : "") + (hasExample() ? exampleBanner() : "") + v();
  const eb = $("#view .page-h .eyebrow");
  if (eb && HELP[route]) eb.outerHTML = `<div class="eyebrow-row">${eb.outerHTML}${helpHTML(route)}</div>`;
  bindView(); fillThumbs();
}
const planCount = () => PLANO.semanas.reduce((a, s) => a + s.dias.reduce((b, d) => b + d.itens.length, 0), 0);
const planBanner = () => `<div class="banner" style="background:var(--white);box-shadow:var(--shadow)">${ic("upload")}<span><b>Sua planilha está pronta para entrar.</b> ${PLANO.semanas.length} semanas e ${planCount()} assuntos de “${esc(PLANO.titulo)}”.</span><div class="row"><button class="btn sm primary" data-act="import-plan">Conferir e importar</button></div></div>`;
const hasExample = () => [...S.docs.values()].some(d => d.exemplo);
const exampleBanner = () => `<div class="banner">${ic("spark", "")}<span><b>Dados de exemplo.</b> Os registros abaixo servem só para você ver a central funcionando.</span><div class="row"><button class="btn sm primary" data-act="clear-example">Apagar exemplos</button></div></div>`;
const localBanner = () => `<div class="banner" style="background:var(--warn-soft)"><span><b style="color:var(--warn)">Modo local.</b> Não consegui conectar à nuvem, então os registros ficam só neste navegador. Recarregue a página quando a internet voltar: a central vai oferecer o envio destes registros para a nuvem.</span></div>`;
const sendBanner = n => `<div class="banner" style="background:var(--white);box-shadow:var(--shadow)">${ic("upload")}<span><b>${n} registro${n === 1 ? " salvo" : "s salvos"} só neste navegador.</b> Envie para a nuvem para não perder e para ver em qualquer computador ou celular.</span><div class="row"><button class="btn sm ghost" data-act="local-skip">Ignorar</button><button class="btn sm primary" data-act="local-send">Enviar para a nuvem</button></div></div>`;

/* ---------- Visão geral ---------- */
function vVisao() {
  const ws = weeks();
  if (!ws.length && localPending().length) return `<div class="page-h"><div><span class="eyebrow">Visão geral</span><h1>Falta um passo</h1></div></div>
    <div class="card">${empty("upload", "Seus registros estão neste navegador", "Clique em “Enviar para a nuvem” para trazer o seu plano e o seu progresso para cá. Não importe a planilha de novo: isso duplicaria as semanas.", `<button class="btn primary" data-act="local-send">${ic("upload")}Enviar para a nuvem</button>`)}</div>`;
  if (!ws.length) return `<div class="page-h"><div><span class="eyebrow">Visão geral</span><h1>Sua central está pronta</h1></div></div>
    <div class="card">${empty("cal", "Comece pelo seu cronograma", "Crie a primeira semana e cadastre os assuntos, ou importe a planilha de acompanhamento. Os indicadores aparecem aqui conforme você registra.",
    `<div class="row" style="justify-content:center">${!settings().planoImportado ? `<button class="btn primary" data-act="import-plan">${ic("upload")}Importar minha planilha</button>` : ""}<button class="btn ghost" data-act="new-week">${ic("plus")}Criar primeira semana</button><button class="btn ghost" data-act="import">${ic("upload")}Importar planilha</button><button class="btn ghost" data-act="seed">${ic("spark")}Ver com dados de exemplo</button></div>`)}</div>`;
  const o = overall(); const t = TODAY();
  const revPend = reviews().filter(r => r.status !== "concluida").length;
  const k = (l, b, s) => `<div class="kpi"><label>${l}</label><b>${b}</b>${s ? `<small>${s}</small>` : ""}</div>`;
  const kpis = `<div class="kpis">
    <div class="kpi lead"><label>Conclusão do planejamento</label><b class="num">${Math.round(o.pct)}%</b><small>${o.done} de ${o.total} conteúdos concluídos</small>${bar(o.pct)}</div>
    ${k("Em andamento", o.and, "conteúdos abertos")}
    ${k("Pendentes", o.pend, "ainda não iniciados")}
    ${k("Horas líquidas", hm(o.min), o.meta ? `meta ${hm(o.meta)} · ${Math.round(o.min / o.meta * 100)}%` : "defina metas nas semanas")}
    ${k("Questões resolvidas", o.qr.toLocaleString("pt-BR"), `${o.qc.toLocaleString("pt-BR")} corretas`)}
    ${k("Acertos", fmtPct(o.acc), "corretas ÷ resolvidas")}
    ${k("Erros registrados", errors().length, `${errors().filter(e => e.status !== "corrigido").length} sem correção`)}
    ${k("Revisões pendentes", revPend, `${reviews().filter(r => r.status !== "concluida" && r.prevista && r.prevista < t).length} atrasadas`)}
  </div>`;
  // próximos passos
  const cw = currentWeek();
  const nextC = contents().filter(c => c.status !== "concluido" && (c.weekId === (cw && cw.id) || (c.prevista && c.prevista <= t))).slice(0, 6);
  const revToday = reviews().filter(r => r.status !== "concluida" && r.prevista && r.prevista <= t).slice(0, 6);
  const steps = `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>Próximos passos</h2><p>${cw ? esc(cw.nome) : ""}</p></div>
      ${nextC.length ? `<div class="subj">${nextC.map(cItem).join("")}</div>` : `<p class="muted small">Nenhum conteúdo pendente na semana atual.</p>`}</div>
    <div class="card"><div class="card-h"><h2>Revisões de hoje</h2><button class="btn sm ghost" data-go="revisoes">Ver todas</button></div>
      ${revToday.length ? `<div class="list">${revToday.map(revItem).join("")}</div>` : `<p class="muted small">Nada para revisar hoje.</p>`}</div>
  </div>`;
  // gráficos
  const lbl = ws.map((w, i) => "S" + (i + 1));
  const st = ws.map(w => weekStats(w.id));
  const disc = disciplinas().map(d => { const cs = contents().filter(c => c.disciplina === d); const qr = cs.reduce((a, c) => a + (+c.qResolvidas || 0), 0), qc = cs.reduce((a, c) => a + (+c.qCorretas || 0), 0); return { l: d, p: pct1(qc, qr) || 0, v: fmtPct(pct1(qc, qr)), qr }; }).filter(r => r.qr > 0).sort((a, b) => b.p - a.p);
  const charts = `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>Horas líquidas por semana</h2><p>barra = realizado · traço = meta</p></div>${barChart(lbl, st.map(s => s.min / 60), { fmt: v => Math.round(v) + "h", target: st.map(s => s.meta / 60) })}</div>
    <div class="card"><div class="card-h"><h2>Evolução dos acertos</h2><p>linha tracejada = 70%</p></div>${lineChart(lbl, st.map(s => s.acc))}</div>
    <div class="card"><div class="card-h"><h2>Desempenho por disciplina</h2><p>% de acertos</p></div>${disc.length ? hbars(disc) : `<p class="muted small">Registre questões nos conteúdos para comparar disciplinas.</p>`}</div>
    <div class="card"><div class="card-h"><h2>Conteúdos concluídos por semana</h2></div>${barChart(lbl, st.map(s => s.done), { fmt: v => Math.round(v) })}</div>
  </div>`;
  return `<div class="page-h"><div><span class="eyebrow">Visão geral</span><h1>${greeting()}</h1><p>${cw ? `Você está na ${esc(cw.nome)}. ${weekStats(cw.id).pend + weekStats(cw.id).and} conteúdos em aberto nesta semana.` : ""}</p></div>
    <div class="row"><button class="btn ghost" data-act="new-session">${ic("clock")}Registrar horas</button><button class="btn primary" data-act="new-error">${ic("plus")}Registrar erro</button></div></div>
    ${homeReminders()}${kpis}${steps}${charts}`;
}
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Bom dia, bons estudos" : h < 18 ? "Boa tarde, bons estudos" : "Boa noite, bons estudos"; };

/* ---------- item de conteúdo ---------- */
function cItem(c) {
  const done = c.status === "concluido";
  const mats = materials().filter(m => m.contentId === c.id).length;
  const ers = errors().filter(e => e.contentId === c.id).length;
  const min = contentMin(c.id);
  const acc = pct1(+c.qCorretas || 0, +c.qResolvidas || 0);
  return `<div class="citem ${done ? "done" : ""}" data-cid="${c.id}">
    <button class="check ${done ? "on no-anim" : ""}" data-act="toggle" data-id="${c.id}" aria-pressed="${done}" aria-label="${done ? "Reabrir" : "Marcar como concluído"}: ${esc(c.assunto)}">${checkSVG()}</button>
    <div style="min-width:0"><div class="ttl" data-act="open-content" data-id="${c.id}">${esc(c.assunto || "Assunto sem nome")}</div>
      <div class="meta"><span>${esc(c.disciplina || "Sem disciplina")}</span>
        ${c.prevista && !(route === "semanas" && wGroup === "dia") ? `<span>${ic("cal")}${fmtD(c.prevista)}</span>` : ""}
        ${c.planejadoMin ? `<span>${hm(c.planejadoMin)} previstas</span>` : ""}
        ${min ? `<span>${ic("clock")}${hm(min)}</span>` : ""}
        ${+c.qResolvidas ? `<span>${ic("q")}${c.qCorretas || 0}/${c.qResolvidas} · ${fmtPct(acc)}</span>` : ""}
        ${mats ? `<span>${ic("clip")}${mats}</span>` : ""}
        ${ers ? `<span style="color:var(--bad)">${ic("err")}${ers}</span>` : ""}
        ${c.revisar ? `<span style="color:var(--pink-ink)">${ic("flag")}revisar</span>` : ""}
      </div></div>
    <div class="right">${chip(STATUS, c.status)}</div>
  </div>`;
}
function revItem(r) {
  const t = TODAY(); const late = r.status !== "concluida" && r.prevista && r.prevista < t;
  return `<div class="li"><div class="stripe ${r.status === "concluida" ? "ok" : late ? "bad" : r.prevista === t ? "pink" : ""}"></div>
    <div class="body"><b>${esc(r.assunto || "Assunto")}</b><p style="margin-top:4px">${tipoChip(r)}</p><p>${esc(r.disciplina || "")} · ${esc(r.motivo || "")} · ${r.status === "concluida" ? "feita em " + fmtD(r.concluidaEm) : (late ? "atrasada desde " : "prevista ") + fmtD(r.prevista)}${r.status === "andamento" ? " · em andamento" : ""}</p></div>
    ${mapBtn(r)}${r.status !== "concluida" ? `<button class="btn sm primary" data-act="done-review" data-id="${r.id}">Concluir</button>` : `<button class="btn sm ghost" data-act="done-review" data-id="${r.id}">Ver</button>`}</div>`;
}

/* ---------- Cronograma ---------- */
let cf = { disc: "", status: "", q: "" };
function vCrono() {
  const ws = weeks();
  const head = `<div class="page-h"><div><span class="eyebrow">Meu cronograma</span><h1>Planejamento completo</h1><p>Todas as semanas e assuntos na ordem do seu plano. Marque o check para concluir.</p></div>
    <div class="row"><button class="btn ghost" data-act="import">${ic("upload")}Importar planilha</button><button class="btn ghost" data-act="new-week">${ic("plus")}Nova semana</button><button class="btn primary" data-act="new-content">${ic("plus")}Novo conteúdo</button></div></div>`;
  if (!ws.length) return head + `<div class="card">${empty("cal", "Nenhuma semana ainda", "Crie uma semana e adicione os assuntos, ou importe a planilha original para trazer tudo de uma vez.", `<div class="row" style="justify-content:center"><button class="btn primary" data-act="new-week">Criar semana</button><button class="btn ghost" data-act="seed">Ver com dados de exemplo</button></div>`)}</div>`;
  const filt = `<div class="filters"><select id="cfDisc">${opts(disciplinas(), cf.disc, "Todas as disciplinas")}</select><select id="cfStatus">${opts(Object.entries(STATUS).map(([k, v]) => [k, v[0]]), cf.status, "Todos os status")}</select><input id="cfQ" placeholder="Buscar assunto" value="${esc(cf.q)}"></div>`;
  const body = ws.map((w, i) => {
    const cs = contentsOf(w.id).filter(c => (!cf.disc || c.disciplina === cf.disc) && (!cf.status || c.status === cf.status) && (!cf.q || (c.assunto || "").toLowerCase().includes(cf.q.toLowerCase())));
    const st = weekStats(w.id);
    if (!cs.length && (cf.disc || cf.status || cf.q)) return "";
    return `<div class="card"><div class="card-h"><div><span class="eyebrow">Semana ${i + 1}</span><h2>${esc(w.nome)}</h2><p>${w.inicio ? fmtDY(w.inicio) + " a " + fmtDY(w.fim) : "Período a definir"}</p></div>
      <div class="row" style="min-width:200px"><div style="flex:1">${bar(st.pct)}</div><span class="small num">${st.done}/${st.total}</span><button class="btn sm ghost" data-go="semanas" data-week="${w.id}">Abrir</button></div></div>
      ${cs.length ? `<div class="subj">${cs.map(cItem).join("")}</div>` : `<p class="muted small">Sem conteúdos. <button class="btn sm ghost" data-act="new-content" data-week="${w.id}">Adicionar</button></p>`}</div>`;
  }).join("");
  const pl = settings().plano;
  const info = pl ? `<div class="card"><div class="card-h" style="margin-bottom:8px"><div><span class="eyebrow">Sobre o plano</span><h2>${esc(pl.titulo)}</h2></div></div><div class="grid g3" style="gap:10px">
    <div><span class="muted small">Período</span><p>${esc(pl.periodo)}</p></div><div><span class="muted small">Carga diária</span><p>${esc(pl.carga)}</p></div><div><span class="muted small">Distribuição diária</span><p>${esc(pl.distribuicao)}</p></div></div>
    ${pl.observacao ? `<p class="small muted" style="margin-top:10px">${esc(pl.observacao)}</p>` : ""}</div>` : "";
  return head + info + filt + (body || `<div class="card"><p class="muted">Nenhum conteúdo com esses filtros.</p></div>`);
}

/* ---------- Semanas ---------- */
let wGroup = "dia";
function vSemanas() {
  const ws = weeks();
  if (!ws.length) return `<div class="page-h"><div><span class="eyebrow">Semanas de estudo</span><h1>Semanas</h1></div></div><div class="card">${empty("weeks", "Nenhuma semana cadastrada", "Cada semana do seu plano terá uma página própria com conteúdos, horas, questões, erros e fechamento.", `<button class="btn primary" data-act="new-week">Criar semana</button>`)}</div>`;
  if (!selWeek || !get(selWeek)) selWeek = (currentWeek() || ws[0]).id;
  const cw = currentWeek();
  const tabs = `<div class="wtabs" role="tablist">${ws.map((w, i) => { const s = weekStats(w.id); return `<button class="wtab ${cw && cw.id === w.id ? "now" : ""}" role="tab" aria-selected="${w.id === selWeek}" data-act="sel-week" data-id="${w.id}"><b>Semana ${i + 1}</b><small>${w.inicio ? fmtD(w.inicio) + "–" + fmtD(w.fim) : esc(w.nome)}</small>${bar(s.pct)}</button>`; }).join("")}
    <button class="wtab" data-act="new-week" style="justify-content:center;align-items:center;color:var(--pink-ink)"><b>+ Nova</b></button></div>`;
  const w = get(selWeek), st = weekStats(w.id), idx = ws.indexOf(w);
  const cs = contentsOf(w.id);
  const groups = {};
  cs.forEach(c => { const k = wGroup === "dia" ? (c.prevista || "Sem data") : (c.disciplina || "Sem disciplina"); (groups[k] = groups[k] || []).push(c); });
  const daySess = d => sessions().filter(x => x.data === d).reduce((a, x) => a + sessionMin(x), 0);
  // dia da semana calculado pela data (o "dia" que veio da planilha fica errado quando o conteúdo é remarcado)
  const gTitle = k => wGroup === "dia" && /^\d{4}-/.test(k) ? `${WEEKDAYS[new Date(k + "T12:00:00").getDay()]} ${fmtD(k)}${k === TODAY() ? ` <span class="chip ok" style="text-transform:none;letter-spacing:0"><i></i>hoje</span>` : ""}${daySess(k) ? ` <span class="chip pink" style="text-transform:none;letter-spacing:0">${hm(daySess(k))} estudadas</span>` : ""}` : esc(k);
  const prev = ws[idx - 1], next = ws[idx + 1];

const viewPref = k => { try { return localStorage.getItem("central-estudos-visao-" + k) || "lista"; } catch (e) { return "lista"; } };

// cols: [{ k, title, cls, items, empty, more }]; card(item) devolve { stripe, body, open }
function kanban(kind, cols, card) {
  return `<div class="kanban">${cols.map((c, ci) => `<section class="kcol" data-kcol="${c.k}" data-kkind="${kind}" aria-label="${esc(c.title)}">
    <div class="kcol-h"><h2>${c.title}</h2><span class="chip ${c.cls}">${c.items.length + (c.more || 0)}</span></div>

      return `<article class="kcard" draggable="true" data-kid="${x.id}" data-kkind="${kind}" style="border-left-color:var(--${v.stripe})">${v.body}
        <div class="kmove">${prev ? `<button class="icon-btn" data-act="kmove" data-kkind="${kind}" data-id="${x.id}" data-to="${prev.k}" aria-label="Mover para ${esc(prev.title)}" title="Mover para ${esc(prev.title)}">‹</button>` : "<span></span>"}
          ${v.open}${next ? `<button class="icon-btn" data-act="kmove" data-kkind="${kind}" data-id="${x.id}" data-to="${next.k}" aria-label="Mover para ${esc(next.title)}" title="Mover para ${esc(next.title)}">›</button>` : "<span></span>"}</div></article>`; }).join("")
      || `<p class="muted small kempty">${c.empty}</p>`}
    ${c.more ? `<p class="muted small kempty">+ ${c.more} mais antiga${c.more === 1 ? "" : "s"}</p>` : ""}</section>`).join("")}</div>`;
}
async function kMove(kind, id, to) {
  const x = get(id); if (!x || x.status === to) return;
  if (kind === "error") {
    await put(Object.assign({}, x, { status: to, historico: (x.historico || []).concat([{ em: new Date().toISOString(), de: ESTATUS[x.status || "pendente"][0], para: ESTATUS[to][0] }]) }));
    toast("Erro movido para " + ESTATUS[to][0]);
  } else {
    await put(Object.assign({}, x, { status: to, concluidaEm: to === "concluida" ? x.concluidaEm || TODAY() : "" }));
    toast(to === "concluida" ? "Revisão concluída. Abra o card para registrar como foi." : "Revisão movida para " + RSTATUS[to][0]);
  }
  render();
}
// arrastar e soltar (computador); no celular e pelo teclado ficam os botões ‹ ›
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest(".kcard"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.kkind + "|" + c.dataset.kid); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest(".kcard"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".kcol.over").forEach(x => x.classList.remove("over")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest(".kcol"); if (!col) return; e.preventDefault(); document.querySelectorAll(".kcol.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest(".kcol"); if (!col) return; e.preventDefault(); col.classList.remove("over");
  const [kind, id] = (e.dataTransfer.getData("text/plain") || "").split("|");
  if (kind === col.dataset.kkind && id) kMove(kind, id, col.dataset.kcol);
});

/* ---------- Desempenho ---------- */
let pf = { week: "", disc: "", q: "" };
function vDesempenho() {
  const head = `<div class="page-h"><div><span class="eyebrow">Desempenho por disciplina</span><h1>Questões e acertos</h1><p>Percentual de acertos = corretas ÷ resolvidas × 100. Não se confunde com o percentual de conclusão do cronograma.</p></div></div>`;
  let cs = contents().filter(c => +c.qResolvidas > 0);
  if (!cs.length) return head + `<div class="card">${empty("perf", "Sem questões registradas", "Abra um conteúdo e informe quantas questões resolveu e quantas acertou. O desempenho aparece aqui por disciplina e assunto.")}</div>`;
  const filt = `<div class="filters"><select id="pfWeek">${opts(weeks().map(w => [w.id, w.nome]), pf.week, "Todas as semanas")}</select><select id="pfDisc">${opts(disciplinas(), pf.disc, "Todas as disciplinas")}</select><input id="pfQ" placeholder="Buscar assunto" value="${esc(pf.q)}"></div>`;
  cs = cs.filter(c => (!pf.week || c.weekId === pf.week) && (!pf.disc || c.disciplina === pf.disc) && (!pf.q || (c.assunto || "").toLowerCase().includes(pf.q.toLowerCase())));
  const discs = [...new Set(cs.map(c => c.disciplina || "—"))].map(d => { const x = cs.filter(c => (c.disciplina || "—") === d); const qr = x.reduce((a, c) => a + +c.qResolvidas, 0), qc = x.reduce((a, c) => a + (+c.qCorretas || 0), 0); return { d, qr, qc, acc: pct1(qc, qr), n: x.length }; }).sort((a, b) => (a.acc ?? 0) - (b.acc ?? 0));
  const tot = discs.reduce((a, d) => ({ qr: a.qr + d.qr, qc: a.qc + d.qc }), { qr: 0, qc: 0 });
  const att = cs.map(c => ({ c, acc: pct1(+c.qCorretas || 0, +c.qResolvidas) })).filter(x => x.acc < 70).sort((a, b) => a.acc - b.acc).slice(0, 6);
  return head + filt + `<div class="kpis"><div class="kpi"><label>Resolvidas</label><b class="num">${tot.qr}</b></div><div class="kpi"><label>Corretas</label><b class="num">${tot.qc}</b></div><div class="kpi"><label>Erradas</label><b class="num">${tot.qr - tot.qc}</b></div><div class="kpi"><label>Acertos</label><b class="num">${fmtPct(pct1(tot.qc, tot.qr))}</b></div></div>
    <div class="grid g2"><div class="card"><div class="card-h"><h2>Por disciplina</h2></div><div class="tbl-wrap"><table><thead><tr><th>Disciplina</th><th class="n">Resolvidas</th><th class="n">Corretas</th><th class="n">Acertos</th></tr></thead><tbody>
      ${discs.map(d => `<tr><td>${esc(d.d)}</td><td class="n">${d.qr}</td><td class="n">${d.qc}</td><td class="n"><span class="chip ${d.acc >= 80 ? "ok" : d.acc >= 70 ? "and" : "bad"}">${fmtPct(d.acc)}</span></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Merecem atenção</h2><p>abaixo de 70%</p></div>${att.length ? `<div class="list">${att.map(x => `<div class="li"><div class="stripe bad"></div><div class="body"><b>${esc(x.c.assunto)}</b><p>${esc(x.c.disciplina)} · ${x.c.qCorretas || 0}/${x.c.qResolvidas} · ${fmtPct(x.acc)}</p></div><button class="btn sm ghost" data-act="open-content" data-id="${x.c.id}">Abrir</button></div>`).join("")}</div>` : `<p class="muted small">Todos os assuntos filtrados estão com 70% ou mais.</p>`}</div></div>
    <div class="card"><div class="card-h"><h2>Por assunto</h2></div><div class="tbl-wrap"><table><thead><tr><th>Assunto</th><th>Disciplina</th><th>Semana</th><th class="n">Resolvidas</th><th class="n">Corretas</th><th class="n">Acertos</th></tr></thead><tbody>
      ${cs.map(c => { const a = pct1(+c.qCorretas || 0, +c.qResolvidas); const w = get(c.weekId); return `<tr><td>${esc(c.assunto)}</td><td>${esc(c.disciplina)}</td><td>${esc(w ? w.nome : "")}</td><td class="n">${c.qResolvidas}</td><td class="n">${c.qCorretas || 0}</td><td class="n">${fmtPct(a)}</td></tr>`; }).join("")}</tbody></table></div></div>`;

/* ---------- Horas líquidas ---------- */
let hDay = TODAY(), hWeek = "", hView = "lista"; // hWeek: "" = semana da data escolhida, "plano" = plano todo, ou o id de uma semana
try { hView = localStorage.getItem("central-estudos-horas-visao") || "lista"; } catch (e) { }
// horas previstas (conteúdos) × horas feitas (blocos) por disciplina, na semana escolhida ou no plano todo
function hoursByDisc(w) {
  const m = new Map(), row = d => m.get(d) || m.set(d, { d, plan: 0, done: 0 }).get(d);
  (w ? contentsOf(w.id) : contents()).forEach(c => row(c.disciplina || "Sem disciplina").plan += +c.planejadoMin || 0);
  (w ? sessions().filter(s => sessionWeek(s) === w.id) : sessions()).forEach(s => { const c = get(s.contentId); row((c && c.disciplina) || s.disciplina || "Sem disciplina").done += sessionMin(s); });
  return [...m.values()].filter(x => x.plan || x.done);
}
// pizza única: tempo realizado no período, dividido por disciplina (cor fixa por disciplina, na ordem do plano)
function hoursPie(w) {
  const discOf = x => { const c = get(x.contentId); return (c && c.disciplina) || x.disciplina || ""; };
  const order = [...new Set([...contents().map(c => c.disciplina), ...sessions().map(discOf)].filter(Boolean))];
  const rows = hoursByDisc(w).filter(x => x.done > 0).map(x => Object.assign(x, { i: order.indexOf(x.d) }))
    .sort((a, b) => (a.i < 0) - (b.i < 0) || a.i - b.i);
  const tot = rows.reduce((a, x) => a + x.done, 0), plan = hoursByDisc(w).reduce((a, x) => a + x.plan, 0);
  const color = x => x.i >= 0 && x.i < 8 ? `var(--s${x.i + 1})` : "var(--ink-3)";
  const name = x => x.i < 0 ? "Sem conteúdo vinculado" : x.d;
  const R = 70, C = 2 * Math.PI * R, gap = rows.length > 1 ? 2 : 0; let acc = 0;
  const arcs = rows.map(x => { const len = C * x.done / tot, a = `<circle cx="100" cy="100" r="${R}" stroke="${color(x)}" stroke-dasharray="${Math.max(0.5, len - gap)} ${C}" stroke-dashoffset="${-(acc + gap / 2)}"><title>${esc(name(x))}: ${hm(x.done)} (${Math.round(x.done / tot * 100)}%)</title></circle>`; acc += len; return a; }).join("");
  const sel = `<select id="hWeek" class="inp" aria-label="Período do gráfico" style="width:auto;min-height:36px;padding:4px 10px">${opts([["plano", "Plano todo"], ...weeks().map(x => [x.id, x.nome + (x.inicio ? ` · ${fmtD(x.inicio)}–${fmtD(x.fim)}` : "")])], w ? w.id : "plano")}</select>`;
  return `<div class="card"><div class="card-h"><div><h2>Tempo realizado por disciplina</h2><p>${tot ? `${hm(tot)} realizadas${plan ? ` · ${hm(plan)} previstas no período (${Math.round(tot / plan * 100)}%)` : ""}` : "Nenhuma hora registrada neste período"}</p></div>${sel}</div>
    ${tot ? `<div class="time-pie"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Tempo realizado: ${hm(tot)}, ${rows.map(x => `${name(x)} ${hm(x.done)}`).join(", ")}"><g transform="rotate(-90 100 100)">${arcs}</g>
        <text x="100" y="104" text-anchor="middle" class="donut-v">${hm(tot)}</text><text x="100" y="124" text-anchor="middle" class="donut-l">realizadas</text></svg>
      <ul class="pie-leg">${rows.map(x => `<li><i style="background:${color(x)}"></i><span>${esc(name(x))}${x.plan ? `<small>de ${hm(x.plan)} previstas</small>` : ""}</span><b class="num">${hm(x.done)}</b><em class="num">${Math.round(x.done / tot * 100)}%</em></li>`).join("")}</ul></div>`
      : `<p class="muted small">Registre blocos de estudo (botão “Novo bloco”) para ver como o tempo se divide entre as disciplinas.</p>`}</div>`;
}

function vFechamentos() {
  const ws = weeks();

  if (!ws.length) return head + `<div class="card">${empty("close", "Sem semanas para comparar", "O histórico aparece quando houver semanas com registros.")}</div>`;

  const revSubj = bySubject().filter(s => s.revisoes).sort((a, b) => b.revisoes - a.revisoes).slice(0, 6);

    <div class="card"><div class="card-h"><h2>Assuntos com mais revisões</h2></div>${revSubj.length ? hbars(revSubj.map(r => ({ l: r.assunto, p: r.revisoes / maxR * 100, v: r.revisoes }))) : `<p class="muted small">Ainda sem revisões registradas.</p>`}</div></div>
    <div class="card"><div class="card-h"><h2>Resumo por semana</h2></div><div class="tbl-wrap"><table><thead><tr><th>Semana</th><th>Período</th><th class="n">Horas</th><th class="n">Meta</th><th class="n">% meta</th><th class="n">Questões</th><th class="n">Acertos</th><th class="n">Concluídos</th><th>Fechamento</th></tr></thead><tbody>

// "Precisa de revisão" no conteúdo cria (ou ajusta) a revisão na aba Revisões; desmarcar remove a criada por ele enquanto estiver "a fazer"
const openReviewOf = c => reviews().find(r => r.status !== "concluida" && (r.origemId === c.id || r.assunto === c.assunto));
async function syncContentReview(before, c, opt) {
  const r = openReviewOf(c);
  if (c.revisar) {
    if (r && r.origem !== "marcado") return "";
    if (r) { if (r.tipo === opt.tipo && r.prevista === opt.prevista) return ""; await put(Object.assign({}, r, { tipo: opt.tipo || rTipo(r), prevista: opt.prevista || r.prevista })); return "revisão atualizada"; }
    const prevista = opt.prevista || addDays(TODAY(), 1);
    await put({ id: uid("rv"), kind: "review", assunto: c.assunto, disciplina: c.disciplina, prevista, motivo: "Marcado para revisão", tipo: opt.tipo || "dificuldade", origem: "marcado", origemId: c.id, status: "pendente" });
    return "revisão criada para " + fmtD(prevista);
  }
  if (before.revisar && r && r.origem === "marcado" && (r.status || "pendente") === "pendente") { await del(r.id); return "revisão removida"; }
  return "";
}

async function uploadFile(file, cid, replaceId) {
  if (!file || !S.assets) return;
  toast("Enviando " + file.name + "…");
  try {
    const r = await S.assets.upload(file);
    const old = replaceId ? get(replaceId) : null;
    await put({ id: replaceId || uid("mt"), kind: "material", contentId: cid, nome: file.name, url: r.url, assetId: r.id, tipo: "Arquivo " + (file.name.split(".").pop() || "").toUpperCase(), contentType: r.contentType, tamanho: r.sizeBytes, arquivo: true });
    if (old && old.assetId) { try { await S.assets.delete(old.assetId); } catch (e) { } }
    toast("Arquivo anexado"); contentForm(get(cid));
  } catch (e) {
    const m = { unsupported_type: "Esse tipo de arquivo não pode ser guardado aqui. Envie em PDF ou vincule pelo Google Drive.", too_large: "Arquivo acima de 20 MB. Envie uma versão menor ou vincule pelo Drive.", not_uploader: "Só quem edita a página pode anexar arquivos.", quota_or_state: "Espaço de anexos cheio. Remova arquivos antigos." }[e && e.code];
    toast(m || "Não consegui enviar o arquivo. Tente de novo.");
  }
}

/* ================= importação de planilha ================= */
function importFlow() {
  openDrawer("Importar planilha", `<div class="sect"><p>Envie a planilha de acompanhamento (.xlsx ou .csv). Cada aba vira uma semana e as linhas com disciplina e assunto viram conteúdos. Você confere tudo antes de importar, e a planilha original não é alterada.</p>

    if (!window.XLSX) { $("#impOut").innerHTML = `<p class="err">O leitor de planilhas não carregou. Atualize a página e tente de novo.</p>`; return; }
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array", cellDates: true });
    const found = []; const issues = [];
    const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    wb.SheetNames.forEach(name => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
      let hi = rows.findIndex(r => r.some(c => /disciplina|materia/.test(norm(c))) && r.some(c => /assunto|conteudo|topico/.test(norm(c))));
      if (hi < 0) { issues.push(`Aba “${name}”: não encontrei colunas de disciplina e assunto.`); return; }
      const h = rows[hi].map(norm);
      const col = re => h.findIndex(c => re.test(c));
      const cD = col(/disciplina|materia/), cA = col(/assunto|conteudo|topico/), cS = col(/status|situacao|concluid/), cQ = col(/resolvid|feitas|questoes/), cC = col(/acert|corret/), cL = col(/link|material|url/), cO = col(/obs/);
      const items = [];
      let lastD = "";
      for (let i = hi + 1; i < rows.length; i++) {
        const r = rows[i]; const first = norm(r.find(x => String(x).trim()));
        if (/fechamento/.test(first)) break;
        const d = String(r[cD] || "").trim() || lastD, a = String(r[cA] || "").trim();
        if (!a) continue; lastD = d;
        const sv = cS >= 0 ? norm(r[cS]) : "";
        items.push({ disciplina: d, assunto: a, status: /conclu|ok|sim|true|feito|x/.test(sv) ? "concluido" : /andamento/.test(sv) ? "andamento" : "pendente", qResolvidas: cQ >= 0 && r[cQ] !== "" ? +r[cQ] || null : null, qCorretas: cC >= 0 && r[cC] !== "" ? +r[cC] || null : null, link: cL >= 0 ? String(r[cL] || "").trim() : "", obs: cO >= 0 ? String(r[cO] || "") : "" });
      }
      if (items.length) found.push({ name, items }); else issues.push(`Aba “${name}”: cabeçalho encontrado, mas nenhuma linha de assunto.`);
    });
    issues.push("Hiperlinks embutidos em texto e fórmulas não são lidos; confira os links depois da importação.");
    const total = found.reduce((a, s) => a + s.items.length, 0);
    $("#impOut").innerHTML = `<div class="sect" style="margin-top:12px"><h3>Encontrei ${found.length} semanas e ${total} conteúdos em “${esc(f.name)}”</h3>
      ${issues.map(i => `<p class="small muted">• ${esc(i)}</p>`).join("")}
      ${found.map(s => `<details class="card" style="padding:12px;box-shadow:none;border:1px solid var(--line)"><summary><b>${esc(s.name)}</b> · ${s.items.length} conteúdos</summary><div class="tbl-wrap"><table><thead><tr><th>Disciplina</th><th>Assunto</th><th>Status</th><th class="n">Q</th></tr></thead><tbody>${s.items.map(x => `<tr><td>${esc(x.disciplina)}</td><td>${esc(x.assunto)}</td><td>${STATUS[x.status][0]}</td><td class="n">${x.qResolvidas ?? ""}</td></tr>`).join("")}</tbody></table></div></details>`).join("")}
      ${total ? `<div><button class="btn primary" id="doImp">Importar ${total} conteúdos</button></div>` : ""}</div>`;
    const b = $("#doImp"); if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = "Importando…";
      let ord = weeks().length;
      for (const s of found) {
        const w = { id: uid("wk"), kind: "week", nome: s.name, ordem: ++ord, inicio: "", fim: "", metaHoras: null, importado: f.name };
        await put(w);
        let o = 0;
        for (const x of s.items) {
          const c = { id: uid("ct"), kind: "content", weekId: w.id, ordem: ++o, disciplina: x.disciplina, assunto: x.assunto, status: x.status, qResolvidas: x.qResolvidas, qCorretas: x.qCorretas, obs: x.obs, concluidaEm: x.status === "concluido" ? TODAY() : "" };
          await put(c);
          if (/^https?:\/\//.test(x.link)) await put({ id: uid("mt"), kind: "material", contentId: c.id, nome: "Material", url: x.link, tipo: /docs\.google\.com\/document/.test(x.link) ? "Google Docs" : /spreadsheets/.test(x.link) ? "Google Sheets" : "Site", arquivo: false });
        }
      }
      closeDrawer(); toast("Importação concluída. Defina o período e a meta de cada semana."); go("crono");
    };
  };
}

          docs.push({ id: uid("mt"), kind: "material", contentId: null, weekId: w.id, data: m.data, nome, url: m.url, tipo, arquivo: false, origem: "planilha" });

  };
}

async function seedExample() {
  const t = TODAY(); const mon = addDays(t, -((new Date(t + "T12:00").getDay() + 6) % 7) - 14);
  const plan = [
    ["Língua Portuguesa", ["Ortografia e acentuação", "Classes de palavras", "Concordância verbal e nominal", "Regência e crase"]],
    ["Direito Constitucional", ["Princípios fundamentais", "Direitos e garantias fundamentais", "Organização do Estado"]],
    ["Raciocínio Lógico", ["Proposições e conectivos", "Equivalências lógicas"]],

  ];

  docs.push(...W);
  const st = [[1, 1, 1, 1, 1, 1], [1, 1, 1, .5, 0, 0], [.5, 0, 0, 0, 0]];
  let k = 0;
  const flat = plan.flatMap(([d, as]) => as.map(a => [d, a]));

  const cs = [];
  per.forEach((arr, wi) => arr.forEach(([d, a], j) => {
    const s = st[wi][j] ?? 0; const status = s === 1 ? "concluido" : s ? "andamento" : "pendente";
    const qr = s ? [20, 30, 15, 25, 18, 22][(k++) % 6] : null;

    const c = { id: uid("ct"), kind: "content", weekId: W[wi].id, ordem: j + 1, disciplina: d, assunto: a, status, prevista: addDays(W[wi].inicio, j), concluidaEm: status === "concluido" ? addDays(W[wi].inicio, j + 1) : "", qResolvidas: qr, qCorretas: qc, revisar: qc && qc / qr < .7, obs: "", ...E };
    cs.push(c); docs.push(c);

  W.forEach((w, wi) => [0, 1, 2, 3, 4].forEach(dd => { const day = addDays(w.inicio, dd); if (day > t) return; const c = cs.filter(x => x.weekId === w.id)[dd % 4]; docs.push({ id: uid("ss"), kind: "session", data: day, inicio: "08:00", fim: wi === 2 ? "12:00" : "13:30", pausasMin: 15, almoco: false, contentId: c.id, disciplina: c.disciplina, ...E }); }));
  const er = (c, cat, st2, exp) => ({ id: uid("er"), kind: "error", contentId: c.id, disciplina: c.disciplina, assunto: c.assunto, data: c.prevista, questao: "Questão de exemplo", categoria: cat, status: st2, explicacao: exp, ...E });
  docs.push(er(cs[1], "Confusão entre conceitos", "pendente", "Exemplo: advérbio modifica verbo, adjetivo ou outro advérbio; adjetivo modifica substantivo."));
  docs.push(er(cs[1], "Desatenção", "revisao", "Exemplo: o enunciado pedia a alternativa incorreta."));
  docs.push(er(cs[5], "Dúvida sobre legislação", "corrigido", "Exemplo: conferir o artigo exato na Constituição."));
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[1].assunto, disciplina: cs[1].disciplina, prevista: t, motivo: "Erro: confusão entre conceitos", origem: "erro", status: "pendente", ...E });
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[0].assunto, disciplina: cs[0].disciplina, prevista: addDays(t, -2), motivo: "Conteúdo concluído", origem: "conteudo", status: "pendente", ...E });
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[4].assunto, disciplina: cs[4].disciplina, prevista: addDays(t, 5), motivo: "Revisão de 7 dias", origem: "conteudo", status: "pendente", ...E });
  docs.push({ id: uid("mt"), kind: "material", contentId: cs[0].id, nome: "Resumo de acentuação (exemplo)", url: "https://docs.google.com/document/d/exemplo", tipo: "Google Docs", arquivo: false, ...E });
  docs.push({ id: "cl_" + W[0].id, kind: "closing", weekId: W[0].id, dificuldades: "Exemplo: classes de palavras exigiram mais tempo do que o previsto.", reforcar: "Classes de palavras", observacoes: "", prioridades: "Exemplo: resolver 30 questões de Constitucional.", finalizadaEm: addDays(W[0].fim, 0) + "T20:00:00.000Z", ...E });
  for (const d of docs) await put(d);
  toast("Exemplo carregado"); render();

/* ================= check animado ================= */
async function toggleContent(btn) {
  const c = get(btn.dataset.id); if (!c) return;
  const done = c.status !== "concluido";
  const row = btn.closest(".citem");
  btn.classList.remove("no-anim");
  animLock = true;
  if (done) { btn.classList.add("on", "pop"); row && row.classList.add("done"); }
  else { btn.classList.remove("on", "pop"); row && row.classList.remove("done"); }
  btn.setAttribute("aria-pressed", done);
  const rec = Object.assign({}, c, { status: done ? "concluido" : (c.status === "concluido" ? "andamento" : c.status), concluidaEm: done ? TODAY() : "" });
  const p = put(rec);
  // atualiza barras e topo imediatamente
  const o = overall(); $("#ovBar").style.width = o.pct + "%"; $("#ovTxt").textContent = `${Math.round(o.pct)}% do plano · ${o.done}/${o.total}`;
  setTimeout(() => { animLock = false; if (pendingSnap) { const s = pendingSnap; pendingSnap = null; applySnap(s); } else render(); }, 750);
  try { await p; if (done) toast("Concluído · " + (c.assunto || "")); } catch (e) { }
}

      const m = get(id); if (!m) break;
      if (!S.downloads) { toast("Use “Abrir material” e salve pelo navegador"); break; }
      try { const b = await (await fetch(m.url)).blob(); await S.downloads.save({ filename: m.nome || "material", data: b }); }
      catch (er) { if (!er || er.code !== "declined") toast("Não consegui baixar. Use “Abrir material”."); }
      break;
    }
    case "rev-config": case "hours-config": {
      const s = settings();
      openDrawer("Preferências", `<form class="form" id="setForm">
        ${fld("Intervalos de revisão (dias)", `<input name="intervalos" id="st-i" value="${esc(s.intervalos)}">`, "full", "Separe por vírgula. Ex.: 1, 7, 15, 30")}
        ${fld("Meta diária (horas)", `<input type="number" step="0.5" min="0" name="metaH" id="st-m" value="${(s.metaDiaria || 0) / 60}">`)}
        ${fld("Desconto do almoço (min)", `<input type="number" min="0" name="almocoMin" id="st-a" value="${s.almocoMin}">`)}
        <label class="fld full toggle"><input type="checkbox" name="almocoPadrao" id="st-ap" ${s.almocoPadrao ? "checked" : ""}><span>Novos blocos já vêm com o desconto do almoço marcado</span></label>
      </form>`, `<button class="btn ghost" id="stC">Cancelar</button><button class="btn primary" id="stS">Salvar</button>`);
      $("#stC").onclick = closeDrawer;
      $("#stS").onclick = async () => { const f = form($("#setForm")); await put(Object.assign({}, get("settings") || {}, { id: "settings", kind: "settings", intervalos: f.intervalos || "1, 7, 15, 30", metaDiaria: Math.round((+f.metaH || 0) * 60), almocoMin: +f.almocoMin || 0, almocoPadrao: f.almocoPadrao })); closeDrawer(); toast("Preferências salvas"); render(); };
      break;
    }
  }
});

render();
boot();
</script>

</body></html>
