<style>
/* Layout: barra lateral fixa no desktop + área de trabalho em cards brancos sobre lavanda; no celular, barra inferior de navegação */
:root{
  --pink:#FF69B4; --pink-ink:#C7337F; --pink-soft:#FFE3F1;
  --lav:#E6E6FA; --lav-deep:#D4D2F2; --white:#FFFFFF;
  --ink:#2D2438; --ink-2:#5E5470; --ink-3:#8E86A0;
  --line:#ECEAF3; --field:#F6F5FA;
  --ok:#2E9E6B; --ok-soft:#E1F4EA; --warn:#C98A12; --warn-soft:#FBF0D9; --bad:#D2455B; --bad-soft:#FBE3E7;
  --shadow:0 1px 2px rgba(45,36,56,.06),0 6px 20px rgba(45,36,56,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-s:10px;
  --frame:color-mix(in srgb,var(--lav) 76%,#8f93b3); --blue:#2F6FDB; --blue-soft:#E3EDFD; --purple:#7A4DDB; --purple-soft:#EEE7FD; --side:var(--lav); --side-ink:var(--ink-2); --side-mute:var(--ink-3); --foot:transparent; --foot-ink:var(--ink-3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pink:#FF7DBF; --pink-ink:#FF9ACD; --pink-soft:#4A2440;
  --lav:#1C1726; --lav-deep:#2A2338; --white:#26202F;
  --ink:#F1ECF8; --ink-2:#C2B9D2; --ink-3:#8F86A0;
  --line:#352D42; --field:#2E2739;
  --ok:#5CC995; --ok-soft:#1E3A2E; --warn:#E5B04A; --warn-soft:#3D3120; --bad:#F07A8C; --bad-soft:#45222A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark; --frame:color-mix(in srgb,var(--lav) 55%,#000); --blue:#6FA2F5; --blue-soft:#1F2D46; --purple:#A98BF0; --purple-soft:#2E2445}}
:root[data-theme="dark"]{
  --pink:#FF7DBF; --pink-ink:#FF9ACD; --pink-soft:#4A2440;
  --lav:#1C1726; --lav-deep:#2A2338; --white:#26202F;
  --ink:#F1ECF8; --ink-2:#C2B9D2; --ink-3:#8F86A0;
  --line:#352D42; --field:#2E2739;
  --ok:#5CC995; --ok-soft:#1E3A2E; --warn:#E5B04A; --warn-soft:#3D3120; --bad:#F07A8C; --bad-soft:#45222A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark; --frame:color-mix(in srgb,var(--lav) 55%,#000); --blue:#6FA2F5; --blue-soft:#1F2D46; --purple:#A98BF0; --purple-soft:#2E2445}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--lav);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink-ink)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--lav-deep);padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pink);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:800;line-height:1.1}
.brand small{display:block;color:var(--ink-3);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--white)}
.nav button[aria-current="page"]{background:var(--white);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--pink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--pink);color:#fff;border-radius:99px;padding:0 7px;font-family:var(--f-mono)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--side-mute);display:flex;flex-direction:column;gap:6px}
/* layout "Painel suave": no computador o dash fica num quadro arredondado; menu por módulos e aba ativa preenchida */
.side{background:var(--side);color:var(--side-ink)}
.side .nav button{color:var(--side-ink)}
.side .nav button:hover,.sheet .nav button:hover{background:var(--pink-soft);color:var(--pink-ink)}
.nav-g{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mute);padding:12px 12px 4px;margin-top:6px;border-top:1px solid color-mix(in srgb,var(--side-ink) 12%,transparent)}
.side .nav{gap:1px}
.nav button[aria-current="page"],.side .nav button[aria-current="page"]{background:var(--pink);color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--pink) 30%,transparent)}
.nav button[aria-current="page"] svg{color:#fff}
.nav button[aria-current="page"] .count{background:#fff;color:var(--pink-ink)}
.me-row{display:flex;align-items:center;gap:4px}
.me{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.me:hover{background:var(--pink-soft)}
.me:hover .me-t b{color:var(--pink-ink)}
.me[aria-current="page"]{background:var(--white);box-shadow:var(--shadow)}
.me[aria-current="page"] .me-t b{color:var(--ink)}.me[aria-current="page"] .me-t small{color:var(--ink-3)}
.me-t{min-width:0;display:flex;flex-direction:column}
.me-t b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--side-ink)}
.me-t small{font-size:.74rem;color:var(--side-mute)}
.me-row .icon-btn{color:var(--side-mute)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;color:#fff;font-family:var(--f-display);font-weight:800;background:linear-gradient(135deg,var(--pink),color-mix(in srgb,var(--pink) 55%,#6b4cff))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:88px;height:88px;font-size:2.1rem}
.foot{background:var(--foot);color:var(--foot-ink)}
@media (min-width:861px){
  body{background:var(--frame)}
  .app{margin:18px;border-radius:28px;background:var(--lav);box-shadow:0 30px 70px rgba(30,30,60,.16);overflow:clip;min-height:calc(100vh - 36px)}
  .side{top:18px;height:calc(100vh - 36px);border-right:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
  .top{border-bottom:0}
}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--lav);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--lav-deep)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lav)}
.top .week-pill{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:99px;padding:6px 14px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem}
.top .week-pill i{width:8px;height:8px;border-radius:50%;background:var(--pink);display:block}
.top .overall{display:flex;align-items:center;gap:10px;flex:1;min-width:180px;max-width:360px}
.top .overall .bar{flex:1}
.top .overall span{font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.top .spacer{flex:1}
.tm-chip{display:flex;align-items:center;gap:2px;background:var(--white);border-radius:99px;padding:3px;box-shadow:var(--shadow);min-width:0}
.tm-chip[hidden]{display:none}
.wk-past{padding:14px 20px}
.goal-pair{display:flex;gap:18px;flex-wrap:wrap}
.goal-pair > div{display:flex;flex-direction:column}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.split-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.split-h .num{margin-left:auto}
.split-row.fds .bar i{opacity:.55}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.app-tip img{border-radius:10px;flex:none}
.app-tip svg{width:16px;height:16px;vertical-align:-3px;color:var(--pink-ink)}
.plan-info{padding:14px 20px}
.plan-info summary{cursor:pointer;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;list-style:none}
.plan-info summary::-webkit-details-marker{display:none}
.plan-info summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;transition:transform .15s}
.plan-info[open] summary::after{transform:rotate(-135deg)}
.plan-info summary b{font-size:.95rem}
.wk-past-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wk-chips{display:flex;flex-wrap:wrap;gap:8px}
.wk-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--field);border:1px solid var(--line);font-size:.84rem}
.wk-chip:hover{border-color:var(--pink)}
.wk-chip:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.wk-chip span{color:var(--ink-2)}
.wk-chip i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff}
.wk-chip i svg{width:12px;height:12px}
.wk-chip em{font-style:normal;font-weight:600;color:var(--warn)}
.wk-chip.pend{border-color:var(--warn)}
.wk-back{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wk-now{box-shadow:var(--shadow),inset 0 0 0 2px var(--pink)}
.tm-chip .tm-go{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 11px;font-weight:600;font-size:.88rem;min-width:0}
.tm-chip .tm-go i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;animation:tmPulse 1.6s ease-in-out infinite}
.tm-chip.paused .tm-go i{background:var(--warn);animation:none}
.tm-chip .tm-d{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-chip .tm-go b,.tm-clock{font-variant-numeric:tabular-nums}
.tm-chip .icon-btn{width:32px;height:32px;border-radius:99px}
@keyframes tmPulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tm-chip .tm-go i{animation:none}}
.tm-card{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;border-left:4px solid var(--ok)}
.tm-card.paused{border-left-color:var(--warn)}
.tm-card .eyebrow{color:var(--ok)}
.tm-card.paused .eyebrow{color:var(--warn)}
.tm-clock{display:block;font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1.15;margin:2px 0}
.tm-card p{margin:0;font-weight:600}
.tm-card small{display:block;margin-top:2px}
.mob-brand{display:none}
.theme-btn{flex:none}
.content{padding-block:24px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1600px;width:100%;margin-inline:auto}
.foot{margin-top:auto;padding:16px 24px;font-size:.78rem;color:var(--ink-3);border-top:1px solid var(--lav-deep);display:flex;gap:8px;align-items:center}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--pink);display:block}

.bottomnav{display:none}

/* elements */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{color:var(--ink-3);font-size:.85rem}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:60ch}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink);font-weight:700}

/* ajuda das abas: botão "Entenda esta aba" ao lado do rótulo; abre ao passar o mouse, com foco do teclado ou com toque */
.eyebrow-row{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.help-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 4px;border-radius:99px;background:var(--white);box-shadow:var(--shadow);font-size:.75rem;font-weight:600;color:var(--ink-2);line-height:1.5}
.help-btn svg{width:16px;height:16px;color:var(--pink)}
.help-btn:hover,.help.open .help-btn{color:var(--ink)}
.help-btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.help-pop{position:absolute;left:0;top:calc(100% + 8px);z-index:4;width:min(420px,calc(100vw - 32px));background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(45,36,56,.18);padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s .1s,transform .15s .1s,visibility 0s linear .25s}
.help-pop::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.help-pop .eyebrow{margin-top:4px}
.help-pop .eyebrow:first-child{margin-top:0}
.help-pop p{color:var(--ink-2)}
.help-pop ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.help-pop .help-tip{margin-top:6px;background:var(--pink-soft);color:var(--ink);border-radius:var(--r-s);padding:8px 10px}
.help-pop .help-tip b{color:var(--pink-ink)}
@media (hover:hover){.help:not(.shut):hover .help-pop{opacity:1;visibility:visible;transform:none;transition-delay:0s}}
.help:not(.shut) .help-btn:focus-visible + .help-pop,.help.open .help-pop{opacity:1;visibility:visible;transform:none;transition-delay:0s}
@media (prefers-reduced-motion:reduce){.help-pop{transform:none}}

/* login (site publicado com dados na nuvem) */
.login{max-width:420px;width:100%;margin:32px auto 0;display:flex;flex-direction:column;gap:16px}
.linkbtn{all:unset;cursor:pointer;color:var(--pink-ink);font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@media (max-width:860px){.help-pop{scroll-margin-bottom:96px}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--ink-3)}
.small{font-size:.84rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:600;background:var(--field);color:var(--ink);transition:transform .12s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary:hover{background:var(--pink-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.84rem;border-radius:9px}
.btn svg{width:16px;height:16px}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.icon-btn:hover{background:var(--field)}
.icon-btn svg{width:17px;height:17px}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--field);color:var(--ink-2);white-space:nowrap}
.chip.pend{background:var(--field);color:var(--ink-2)}
.chip.and{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pink{background:var(--pink-soft);color:var(--pink-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}.chip.purple{background:var(--purple-soft);color:var(--purple)}
.stripe.blue{background:var(--blue)}.stripe.purple{background:var(--purple)}
.fn-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.fn-row{display:grid;grid-template-columns:12px minmax(0,1fr) 110px 34px 96px;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.fn-row .inp{min-height:36px;padding:6px 10px}
.fn-dot{width:12px;height:12px;border-radius:50%}
.fn-n{text-align:center;font-family:var(--f-mono)}
.fn-acts{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.fn-acts .icon-btn{width:30px;height:30px;font-weight:700}
.fn-acts .icon-btn:disabled{opacity:.3;cursor:default}
@media (max-width:600px){.fn-row{grid-template-columns:12px minmax(0,1fr) auto;grid-template-areas:"d n c" ". s a"}.fn-dot{grid-area:d}.fn-nome{grid-area:n}.fn-n{grid-area:c}.fn-cor{grid-area:s}.fn-acts{grid-area:a;justify-content:flex-end}}
.fn-lock{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
/* Visão geral: o card de conclusão ocupa duas linhas e os outros 7 fecham as linhas (6 colunas na tela larga, 4 na média), sem card sobrando */
@media (min-width:861px){.kpis.home{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.home .kpi.lead{grid-row:span 2}.kpis.home .kpi:last-child{grid-column:span 2}}
@media (min-width:1280px){.kpis.home{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* Horas líquidas: card do dia (largo) + 3 cards numa linha só a partir da tela média */
@media (min-width:861px){.kpis.horas{grid-template-columns:repeat(5,minmax(0,1fr))}}
/* celular (2 colunas): se o último card ficaria sozinho, ele ocupa a linha inteira */
@media (max-width:860px){.kpis .kpi.lead ~ .kpi:last-child:nth-child(even){grid-column:1/-1}}
.kpi{background:var(--white);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi label{font-size:.75rem;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:.78rem;color:var(--ink-2)}
.kpi.lead{grid-column:span 2;background:var(--ink);color:var(--white)}
.hero{border-radius:24px;padding:24px 26px;color:#fff;background:linear-gradient(120deg,color-mix(in srgb,var(--pink) 84%,#000),color-mix(in srgb,var(--pink) 52%,#3b2a86));box-shadow:0 14px 34px color-mix(in srgb,var(--pink) 26%,transparent);display:flex;flex-direction:column;gap:18px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero .eyebrow.hero-date{display:inline-flex;align-items:center;gap:8px;color:#fff;letter-spacing:.12em;border:1px solid #ffffff55;background:#ffffff22;border-radius:99px;padding:5px 12px}
.hero-date i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
.hero h1{font-size:2.3rem;margin:12px 0 2px;color:#fff}
.hero p{margin:0;color:#ffffffde}
.hero .btn{background:#fff;color:color-mix(in srgb,var(--pink) 66%,#000);box-shadow:none}
.hero .help-pop{color:var(--ink);width:min(420px,calc(100vw - 72px))}
:root[data-theme="dark"] .hero{background:linear-gradient(120deg,color-mix(in srgb,var(--pink) 62%,#000),color-mix(in srgb,var(--pink) 38%,#2b1d55))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(120deg,color-mix(in srgb,var(--pink) 62%,#000),color-mix(in srgb,var(--pink) 38%,#2b1d55))}}
.hero .btn.ghost{background:#ffffff24;color:#fff;border:1px solid #ffffff5c}
.hero .linkbtn{color:#fff;text-decoration:underline}
.hero-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hk{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:center;background:#ffffff24;border-radius:16px;padding:12px 14px;min-width:0}
.hk .ico{grid-row:span 3;width:44px;height:44px;border-radius:13px;background:#fff;color:var(--pink-ink);display:grid;place-items:center}
.hk .ico svg,.kpi.ic .ico svg{width:20px;height:20px}
.hk label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffffffd6}
.hk b{font-family:var(--f-display);font-size:1.55rem;font-weight:800;line-height:1.15}
.hk small{color:#ffffffd6;font-size:.78rem}
.kpis.home2{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi.ic{flex-direction:row;align-items:center;gap:12px}
.kpi.ic .ico{width:42px;height:42px;border-radius:12px;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;flex:none}
.kpi.ic > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.conta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.conta .col{display:flex;flex-direction:column;gap:20px}
.prof{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cf-h{font-size:.95rem;margin:16px 0 8px}
.sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.swc{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:10px;border:2px solid var(--line);background:var(--white);display:flex;flex-direction:column;gap:8px;font-size:.8rem;font-weight:600}
.swc[aria-pressed="true"]{border-color:var(--pink)}
.swc:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.swc .pv{height:42px;border-radius:9px;display:grid;grid-template-columns:30% 1fr;overflow:hidden;border:1px solid #0000000f}
.swc .pv i{display:flex;align-items:center;justify-content:center}
.swc .pv u{width:46%;height:10px;border-radius:5px;display:block}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pick label{display:flex;flex-direction:column;gap:6px;font-size:.76rem;font-weight:600;color:var(--ink-2)}
.pick input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--white);cursor:pointer}
.kpi.lead label{color:var(--lav-deep)}
.kpi.lead b{font-size:2.4rem}
.kpi.lead small{color:var(--lav-deep)}
.kpi.lead .bar{background:rgba(255,255,255,.15);margin-top:6px}
:root[data-theme="dark"] .kpi.lead{background:var(--pink-soft);color:var(--ink)}
:root[data-theme="dark"] .kpi.lead label,:root[data-theme="dark"] .kpi.lead small{color:var(--ink-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.lead{background:var(--pink-soft);color:var(--ink)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.lead label,:root:not([data-theme="light"]) .kpi.lead small{color:var(--ink-2)}}

/* Content rows + animated check */
.subj{display:flex;flex-direction:column;gap:2px}
.subj-h{display:flex;align-items:center;gap:8px;padding:12px 4px 6px;font-weight:700;font-size:.85rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.subj-h .dot{width:9px;height:9px;border-radius:3px;background:var(--pink)}
.citem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 10px;border-radius:12px;transition:background .2s}
.citem:hover{background:var(--field)}
.citem .ttl{font-weight:600;cursor:pointer;min-width:0}
.citem .ttl:hover{color:var(--pink-ink)}
.citem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:.78rem;color:var(--ink-3);align-items:center}
.citem .meta span{display:inline-flex;align-items:center;gap:4px}
.citem .meta svg{width:13px;height:13px}
.citem.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.citem .right{display:flex;align-items:center;gap:6px}

.check{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.check svg{width:30px;height:30px;overflow:visible}
.check .ring{fill:none;stroke:var(--ink-3);stroke-width:2;transition:stroke .2s}
.check .fill{fill:var(--pink);transform-origin:15px 15px;transform:scale(0);transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.check .tick{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s ease .18s}
.check:hover .ring{stroke:var(--pink)}
.check.on .ring{stroke:var(--pink)}
.check.on .fill{transform:scale(1)}
.check.on .tick{stroke-dashoffset:0}
.check.pop::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pink);animation:ring .55s ease-out forwards}
@keyframes ring{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.35)}}
.check.no-anim .fill,.check.no-anim .tick{transition:none}
@media (prefers-reduced-motion:reduce){.check .fill,.check .tick,.bar>i{transition:none}.check.pop::after{animation:none}}

/* week tabs */
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.wtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.wtab{all:unset;cursor:pointer;flex:none;background:var(--white);border-radius:12px;padding:8px 14px;min-width:110px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border:2px solid transparent}
.wtab b{font-size:.88rem}
.wtab small{font-size:.72rem;color:var(--ink-3)}
.wtab .bar{height:4px}
.wtab[aria-selected="true"]{border-color:var(--pink)}
.wtab.now b::after{content:" · atual";color:var(--pink-ink);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);outline:none;transition:border .15s,background .15s}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--pink);background:var(--white)}
.fld .hint{font-size:.75rem;color:var(--ink-3)}
.pick{position:relative}
.fld .pick .pick-in{padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.fld .pick .pick-in:focus{background-image:none}
.fld .pick .pick-in:focus::placeholder{color:var(--ink-2)}
.pick-x{all:unset;cursor:pointer;position:absolute;right:30px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.pick-x:hover{background:var(--line);color:var(--ink)}
.pick-x[hidden]{display:none}
.pick-x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;max-height:min(340px,50vh);overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,10,40,.18)}
.pick-list[hidden]{display:none}
.pick-list li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.35}
.pick-list li small{display:block;font-size:.72rem;color:var(--ink-3);font-weight:600}
.pick-list li.on{background:var(--field)}
.pick-list li[aria-selected=true]{box-shadow:inset 3px 0 0 var(--pink)}
.pick-list li.blank{color:var(--ink-2);font-style:italic}
.pick-list li.none{color:var(--ink-3);cursor:default}
.pick-list mark{background:var(--pink-soft,rgba(255,105,180,.22));color:inherit;border-radius:3px;padding:0 1px}
.fld .err{font-size:.75rem;color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.toggle input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--pink)}
.toggle input:checked::after{transform:translateX(16px)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{min-height:38px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:.88rem;max-width:100%}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(45,36,56,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--white);z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(45,36,56,.15);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1;min-width:0}
.drawer-b{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.drawer-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sect{display:flex;flex-direction:column;gap:10px}
.sect > h3{display:flex;align-items:center;gap:8px;font-size:.92rem}
.sect > h3 svg{width:16px;height:16px;color:var(--pink)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(420px,calc(100% - 32px));background:var(--white);border-radius:var(--r);z-index:51;padding:22px;box-shadow:0 20px 60px rgba(45,36,56,.3);opacity:0;pointer-events:none;transition:all .2s;display:flex;flex-direction:column;gap:14px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mscrim{z-index:50}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:12px;z-index:60;opacity:0;transition:all .25s;font-weight:500;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.mat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.mat .ico{width:34px;height:34px;border-radius:9px;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;flex:none;font-size:.62rem;font-weight:800;font-family:var(--f-mono)}
.mat .info{flex:1;min-width:0}
.mat .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.mat .info small{color:var(--ink-3);font-size:.75rem}

.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .art{width:64px;height:64px;border-radius:20px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.empty .art svg{width:30px;height:30px}
.empty p{color:var(--ink-2);max-width:46ch}

.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--pink-soft);color:var(--ink);font-size:.88rem;flex-wrap:wrap}
.banner b{color:var(--pink-ink)}
.banner svg{width:18px;height:18px;flex:none;color:var(--pink-ink)}
.banner .row{margin-left:auto}

.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white)}
.li .body{flex:1;min-width:0}
.scroll-box{max-height:460px;overflow-y:auto;overscroll-behavior:contain;padding:2px 6px 2px 2px;margin:0 -6px 0 -2px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink-3) 55%,transparent) transparent}
.scroll-box::-webkit-scrollbar{width:8px}.scroll-box::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink-3) 55%,transparent);border-radius:8px}
.sum-chev{list-style:none}.sum-chev::-webkit-details-marker{display:none}
.chev-d{width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s;margin:0 6px 4px;display:inline-block}
details[open] > summary .chev-d{transform:rotate(-135deg);margin-bottom:-2px}
.li-acts{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:860px){.rev-li{flex-wrap:wrap;position:relative;padding-left:24px}.rev-li .stripe{position:absolute;left:12px;top:12px;bottom:12px;height:auto}.rev-li .li-acts{flex-basis:100%;justify-content:flex-end}}
.li .body b{display:block}
.li .body p{font-size:.84rem;color:var(--ink-2);margin-top:2px}
.li .body p.err-exp{color:var(--ink);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)} .stripe.pink{background:var(--pink)}

.chart{width:100%;height:auto;display:block}
.kpis.desemp .kpi.ic > div{flex:1}
.kpis.desemp .bar{margin-top:6px}
.acc-k.ok .ico{background:var(--ok-soft);color:var(--ok)}.acc-k.and .ico{background:var(--warn-soft);color:var(--warn)}.acc-k.bad .ico{background:var(--bad-soft);color:var(--bad)}
.hbs{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.hb.acc{grid-template-columns:minmax(0,3fr) minmax(60px,3fr) 76px}
.hb.acc .lbl small{display:block;color:var(--ink-3);font-size:.74rem}
.hb.acc .v{display:flex;justify-content:flex-end}
.fx-bar{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px;margin:6px 0 14px}
.fx-bar i{display:block;height:100%}
.fx-leg{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fx-leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 46px;align-items:center;gap:10px;font-size:.88rem}
.fx-leg li i{width:12px;height:12px;border-radius:4px}
.fx-leg b{font-family:var(--f-mono)}.fx-leg em{font-style:normal;color:var(--ink-3);font-family:var(--f-mono);font-size:.8rem;text-align:right}
.tbl-scroll{max-height:520px;overflow:auto;overscroll-behavior:contain}
.tbl-scroll thead th{position:sticky;top:0;background:var(--white);z-index:1}
.acc-cell{min-width:150px;display:flex;align-items:center;gap:10px}
.acc-cell .bar{flex:1;min-width:50px}
.acc-cell .chip{min-width:64px;justify-content:center}
.tbl-acc td{vertical-align:middle}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wk-card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--white)}
.wk-card.futura{opacity:.72}
.wk-card.atual{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.wk-top{display:flex;align-items:center;gap:10px}
.wk-top > div{flex:1;min-width:0}
.wk-top b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top small{color:var(--ink-3);font-size:.76rem}
.wk-n{width:36px;height:36px;border-radius:11px;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none}
.wk-card.fechada .wk-n{background:var(--ok-soft);color:var(--ok)}
.wk-l{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.82rem}
.wk-l span{color:var(--ink-2)}
.wk-l b{font-size:.8rem;font-family:var(--f-mono)}
.wk-foot{display:flex;align-items:flex-end;gap:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.wk-foot > div{display:flex;flex-direction:column;gap:3px}
.wk-foot small{font-size:.7rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.wk-foot b{font-size:1rem}
.wk-foot .btn{margin-left:auto}
#printArea{display:none}
@media print{
  body.print-rel{background:#fff!important}
  body.print-rel > *:not(#printArea){display:none!important}
  body.print-rel #printArea{display:block}
  @page{margin:12mm}
}
#printArea{--ink:#1d1d2b;--ink-2:#444457;--ink-3:#6b6b80;--line:#e3e3ec;--white:#fff;--ok:#2E9E6B;--ok-soft:#E1F4EA;--warn:#B07A0E;--warn-soft:#FBF0D9;--bad:#D2455B;--bad-soft:#FBE3E7;
  color:var(--ink);background:#fff;font-family:var(--f-body);font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .rl-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--pink);padding-bottom:10px;margin-bottom:14px}
#printArea .rl-h span{font-size:9pt;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
#printArea .rl-h h1{font-family:var(--f-display);font-size:20pt;margin:2px 0}
#printArea .rl-h p{margin:0;color:var(--ink-2)}

function sessionMin(s) {
  if (s.minutosManuais != null && s.minutosManuais !== "") return Math.max(0, +s.minutosManuais);
  const a = toMin(s.inicio), b = toMin(s.fim);
  if (a == null || b == null) return 0;
  let m = b - a; if (m < 0) m += 1440;

const domingoDe = fim => addDays(fim, (7 - new Date(fim + "T12:00:00").getDay()) % 7);

}

const metaDoDia = d => (isFds(d) ? +settings().metaFds : +settings().metaDiaria) || 0;
function sessionWeek(s) {

function weekStats(wid) {

  const and = cs.filter(c => c.status === "andamento").length;

  const qr = cs.reduce((t, c) => t + (+c.qResolvidas || 0), 0);
  const qc = cs.reduce((t, c) => t + (+c.qCorretas || 0), 0);

}

}

function bySubject() {

  const open = () => { if (!list.hidden) return; const o = sel.selectedOptions[0]; inp.value = ""; inp.placeholder = o && o.value ? o.text : "Digite para buscar"; show(""); };
  const close = () => { list.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); label(); };
  const choose = o => { if (o && o.value !== sel.value) { sel.value = o.value; sel.dispatchEvent(new Event("change", { bubbles: true })); sel.dispatchEvent(new Event("input", { bubbles: true })); } close(); inp.blur(); };
  inp.addEventListener("focus", open);
  inp.addEventListener("click", open);
  inp.addEventListener("input", () => show(inp.value));
  inp.addEventListener("blur", close);
  inp.addEventListener("keydown", e => {
    if (list.hidden && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) open(); // voltou a digitar depois do Esc
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (list.hidden) { open(); return; } act = Math.max(0, Math.min(items.length - 1, act + (e.key === "ArrowDown" ? 1 : -1))); mark(); }
    else if (e.key === "Enter") { e.preventDefault(); if (list.hidden && !lastQ) return; if (list.hidden || lastQ !== inp.value) show(inp.value); if (items[act]) choose(items[act]); }
    else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); e.stopPropagation(); close(); }
  });
  list.addEventListener("mousedown", e => e.preventDefault()); // não perder o foco antes do clique
  list.addEventListener("click", e => { e.preventDefault(); const li = e.target.closest("li[data-i]"); if (li) choose(items[+li.dataset.i]); }); // preventDefault: o <label> em volta reabriria a lista
  clr.addEventListener("mousedown", e => e.preventDefault());
  clr.addEventListener("click", () => choose(blank()));
  // opções trocadas por código (ex.: lista do timer muda com a matéria) ou valor mudado por fora
  new MutationObserver(label).observe(sel, { childList: true });
  sel.addEventListener("change", label);
  label();
}

/* ---- gráficos SVG ---- */
function barChart(labels, values, { fmt = v => v, target = null, h = 180, alt = null } = {}) {
  if (!values.length) return "";
  const W = 560, H = h, L = 36, B = 24, T = 10, R = 8;
  const max = Math.max(1, ...values, ...(target ? target : [0])) * 1.1;
  const bw = (W - L - R) / values.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = max / 1.1 * i / 3; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; }
  values.forEach((v, i) => {
    const x = L + i * bw + bw * .2, w = bw * .6;
    g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, H - B - y(v))}" rx="4" fill="var(--pink)"${alt && alt[i] ? ' fill-opacity=".4"' : ""}><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if (target && target[i]) g += `<line x1="${x - 3}" x2="${x + w + 3}" y1="${y(target[i])}" y2="${y(target[i])}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(labels, values, { h = 180 } = {}) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (!pts.length) return `<p class="muted small" style="padding:40px 0;text-align:center">Registre questões para ver a evolução.</p>`;
  const W = 560, H = h, L = 36, B = 24, T = 12, R = 14;
  const x = i => L + (labels.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / 100);
  let g = "";
  [0, 50, 70, 100].forEach(v => g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" ${v === 70 ? 'stroke-dasharray="4 3"' : ""}/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`);
  const d = pts.map((p, i) => (i ? "L" : "M") + x(p[0]) + " " + y(p[1])).join(" ");
  g += `<path d="${d} L${x(pts[pts.length - 1][0])} ${H - B} L${x(pts[0][0])} ${H - B}Z" fill="var(--pink)" opacity=".12"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? "var(--pink)" : "var(--white)"}" stroke="var(--pink)" stroke-width="2"><title>${esc(labels[p[0]])}: ${fmtPct(p[1])}</title></circle>`);
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const hbars = rows => rows.map(r => `<div class="hb"><span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span>${bar(r.p)}<span class="v">${r.v}</span></div>`).join("");

  if (!selWeek || !get(selWeek)) selWeek = (currentWeek() || ws[0]).id;
  const cw = currentWeek();
  const tabs = `<div class="wtabs" role="tablist">${ws.map((w, i) => { const s = weekStats(w.id); return `<button class="wtab ${cw && cw.id === w.id ? "now" : ""}" role="tab" aria-selected="${w.id === selWeek}" data-act="sel-week" data-id="${w.id}"><b>Semana ${i + 1}</b><small>${w.inicio ? fmtD(w.inicio) + "–" + fmtD(w.fim) : esc(w.nome)}</small>${bar(s.pct)}</button>`; }).join("")}
    <button class="wtab" data-act="new-week" style="justify-content:center;align-items:center;color:var(--pink-ink)"><b>+ Nova</b></button></div>`;
  const w = get(selWeek), st = weekStats(w.id), idx = ws.indexOf(w);
  const cs = contentsOf(w.id);
  const groups = {};
  cs.forEach(c => { const k = wGroup === "dia" ? (c.prevista || "Sem data") : (c.disciplina || "Sem disciplina"); (groups[k] = groups[k] || []).push(c); });
  const daySess = d => sessions().filter(x => x.data === d).reduce((a, x) => a + sessionMin(x), 0);
  // dia da semana calculado pela data (o "dia" que veio da planilha fica errado quando o conteúdo é remarcado)
  const gTitle = k => wGroup === "dia" && /^\d{4}-/.test(k) ? `${WEEKDAYS[new Date(k + "T12:00:00").getDay()]} ${fmtD(k)}${k === TODAY() ? ` <span class="chip ok" style="text-transform:none;letter-spacing:0"><i></i>hoje</span>` : ""}${daySess(k) ? ` <span class="chip pink" style="text-transform:none;letter-spacing:0">${hm(daySess(k))} estudadas</span>` : ""}` : esc(k);
  const prev = ws[idx - 1], next = ws[idx + 1];
  const head = `<div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="card-h" style="margin:0"><div><span class="eyebrow">Semana ${idx + 1} de ${ws.length}</span><h1>${esc(w.nome)}</h1><p>${w.inicio ? fmtDY(w.inicio) + " a " + fmtDY(w.fim) : "Período a definir"} · meta ${w.metaHoras ? fmtH(+w.metaHoras) + (+w.metaFds ? ` (${fmtH(+w.metaFds)} no fim de semana)` : "") : "não definida"} <button class="linkbtn" data-act="hours-config" data-week="${w.id}">ajustar</button></p></div>
      <div class="row">${prev ? `<button class="btn sm ghost" data-act="sel-week" data-id="${prev.id}">‹ Anterior</button>` : ""}${next ? `<button class="btn sm ghost" data-act="sel-week" data-id="${next.id}">Próxima ›</button>` : ""}<button class="icon-btn" data-act="edit-week" data-id="${w.id}" aria-label="Editar semana">${ic("edit")}</button></div></div>
    <div class="row"><div style="flex:1;min-width:160px">${bar(st.pct)}</div><b class="num">${Math.round(st.pct)}%</b><span class="muted small">${st.done} concluídos · ${st.and} em andamento · ${st.pend} pendentes</span></div>
  </div>`;
  const list = `<div class="card"><div class="card-h"><h2>Conteúdos programados</h2><div class="row"><div class="seg" role="group" aria-label="Agrupar"><button data-act="wgroup" data-g="dia" aria-pressed="${wGroup === "dia"}">Por dia</button><button data-act="wgroup" data-g="disc" aria-pressed="${wGroup === "disc"}">Por disciplina</button></div><button class="btn sm primary" data-act="new-content" data-week="${w.id}">${ic("plus")}Conteúdo</button></div></div>
    ${cs.length ? Object.keys(groups).sort().map(d => [d, groups[d]]).map(([d, arr]) => `<div class="subj"><div class="subj-h"><span class="dot"></span>${gTitle(d)}<span class="muted" style="font-weight:500">· ${arr.filter(c => c.status === "concluido").length}/${arr.length}</span></div>${arr.map(cItem).join("")}</div>`).join("") : `<p class="muted small">Nenhum conteúdo nesta semana. Adicione o primeiro assunto.</p>`}</div>`;
  const mats = materials().filter(m => m.weekId === w.id || cs.some(c => c.id === m.contentId));
  const reg = `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>Horas e questões</h2><button class="btn sm ghost" data-act="new-session" data-week="${w.id}">${ic("clock")}Registrar horas</button></div>
      <div class="grid g2" style="gap:10px">
        <div><span class="muted small">Horas líquidas</span><div class="num" style="font-size:1.4rem;font-weight:600">${hm(st.min)}</div>${st.meta ? bar(st.min / st.meta * 100) : ""}<span class="muted small">${st.meta ? `${Math.round(st.min / st.meta * 100)}% da meta de ${hm(st.meta)}` : "sem meta"}</span>${st.metaFds || st.minFds ? `<span class="muted small" style="display:block">dias úteis ${hm(st.minUteis)}${st.metaUteis ? "/" + hm(st.metaUteis) : ""} · fim de semana ${hm(st.minFds)}${st.metaFds ? "/" + hm(st.metaFds) : ""}</span>` : ""}</div>
        <div><span class="muted small">Questões</span><div class="num" style="font-size:1.4rem;font-weight:600">${st.qc}/${st.qr}</div><span class="muted small">acertos ${fmtPct(st.acc)}</span></div>
      </div></div>
    <div class="card"><div class="card-h"><h2>Materiais da semana</h2><button class="btn sm ghost" data-go="biblioteca">Biblioteca</button></div>
      ${mats.length ? `<div class="list">${mats.slice(0, 6).map(matItem).join("")}</div>` : `<p class="muted small">Vincule links ou anexe arquivos dentro de cada conteúdo.</p>`}</div>
  </div>`;
  const errs = `<div class="card"><div class="card-h"><h2>Principais erros</h2><div class="row" style="gap:8px">${st.errs.length ? `<span class="chip bad">${st.errs.length}</span>` : ""}<button class="btn sm ghost" data-act="new-error" data-week="${w.id}">${ic("plus")}Registrar erro</button></div></div>
    ${st.errs.length ? `<div class="list scroll-box">${st.errs.map(errItem).join("")}</div>` : `<p class="muted small">Nenhum erro ligado aos conteúdos desta semana.</p>`}</div>`;
  return `<div class="page-h"><div><span class="eyebrow">Semanas de estudo</span></div></div>` + tabs + head + list + reg + errs + closingSection(w);
}

/* ---------- Fechamento ---------- */
function closingSection(w) {
  const st = weekStats(w.id); const c = closingOf(w.id) || {};

  const fin = c.finalizadaEm;
  return `<div class="card" id="closing"><div class="card-h"><div><span class="eyebrow">Fechamento da semana</span><h2>${fin ? "Semana finalizada em " + fmtDY(fin.slice(0, 10)) : "Como foi esta semana"}</h2></div>${fin ? `<span class="chip ok"><i></i>Finalizada</span>` : ""}</div>
    <div class="summary-hero" style="margin-bottom:16px">
      <div><label>Horas líquidas</label><b class="num">${hm(st.min)}</b><small>${st.meta ? Math.round(st.min / st.meta * 100) + "% da meta (" + hm(st.meta) + ")" : "meta não definida"}${st.metaFds || st.minFds ? ` · fim de semana ${hm(st.minFds)}${st.metaFds ? " de " + hm(st.metaFds) : ""}` : ""}</small></div>
      <div><label>Questões</label><b class="num">${st.qr}</b><small>${st.qc} corretas</small></div>
      <div><label>Acertos</label><b class="num">${fmtPct(st.acc)}</b><small>corretas ÷ resolvidas</small></div>
      <div><label>Conteúdos</label><b class="num">${st.done}/${st.total}</b><small>${st.pend + st.and} em aberto</small></div>
    </div>
    <form class="form" id="closingForm">
      ${fld("Principais dificuldades", `<textarea name="dificuldades" id="cl-dif">${esc(c.dificuldades)}</textarea>`)}
      ${fld("Assuntos para reforçar", `<textarea name="reforcar" id="cl-ref">${esc(c.reforcar || (sugg.length && !c.id ? sugg.join("\n") : ""))}</textarea>`, "", sugg.length ? "Sugestão a partir dos acertos e erros" : "")}
      ${fld("Observações e aprendizados", `<textarea name="observacoes" id="cl-obs">${esc(c.observacoes)}</textarea>`)}
      ${fld("Prioridades para a próxima semana", `<textarea name="prioridades" id="cl-pri">${esc(c.prioridades)}</textarea>`)}
      <div class="full row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="save-closing" data-id="${w.id}">Salvar anotações</button><button type="button" class="btn primary" data-act="finish-week" data-id="${w.id}">${fin ? "Atualizar fechamento" : "Finalizar semana"}</button></div>
    </form></div>`;
}
async function saveClosing(wid, finish) {
  const f = form($("#closingForm"));
  const c = closingOf(wid) || { id: "cl_" + wid, kind: "closing", weekId: wid };
  Object.assign(c, f);
  if (finish) c.finalizadaEm = new Date().toISOString();
  await put(c); toast(finish ? "Semana finalizada" : "Anotações salvas");
  if (finish) showWeekSummary(wid);
}
function showWeekSummary(wid) {
  const w = get(wid), st = weekStats(wid), c = closingOf(wid) || {};
  openDrawer("Resumo · " + w.nome, `<div class="summary-hero">
      <div><label>Horas</label><b>${hm(st.min)}</b></div><div><label>Meta</label><b>${st.meta ? Math.round(st.min / st.meta * 100) + "%" : "—"}</b></div>
      <div><label>Acertos</label><b>${fmtPct(st.acc)}</b></div><div><label>Concluídos</label><b>${st.done}/${st.total}</b></div></div>
    <div class="sect"><h3>Por disciplina</h3>${hbars([...new Set(contentsOf(wid).map(x => x.disciplina))].map(d => { const cs = contentsOf(wid).filter(x => x.disciplina === d); const dn = cs.filter(x => x.status === "concluido").length; return { l: d || "—", p: dn / cs.length * 100, v: dn + "/" + cs.length }; }))}</div>
    ${c.dificuldades ? `<div class="sect"><h3>Dificuldades</h3><p>${esc(c.dificuldades).replace(/\n/g, "<br>")}</p></div>` : ""}

/* ---------- Kanban (alternativa à lista em Erros e Revisões) ---------- */
const viewPref = k => { try { return localStorage.getItem("central-estudos-visao-" + k) || "lista"; } catch (e) { return "lista"; } };
const VIEW = { erros: viewPref("erros"), revisoes: viewPref("revisoes") };
const viewSeg = k => `<div class="seg" role="group" aria-label="Visualização"><button data-act="view" data-k="${k}" data-v="lista" aria-pressed="${VIEW[k] === "lista"}">Lista</button><button data-act="view" data-k="${k}" data-v="kanban" aria-pressed="${VIEW[k] === "kanban"}">Kanban</button></div>`;
// cols: [{ k, title, cls, items, empty, more }]; card(item) devolve { stripe, body, open }
function kanban(kind, cols, card) {
  return `<div class="kanban" style="--kn:${cols.length};--kmin:${cols.length > 3 ? 220 : 0}px">${cols.map((c, ci) => `<section class="kcol" data-kcol="${c.k}" data-kkind="${kind}" aria-label="${esc(c.title)}">
    <div class="kcol-h"><h2>${c.title}</h2><span class="chip ${c.cls}">${c.items.length + (c.more || 0)}</span></div>
    <div class="kcol-b">${c.items.map(x => { const v = card(x), prev = cols[ci - 1], next = cols[ci + 1];
      return `<article class="kcard" draggable="true" data-kid="${x.id}" data-kkind="${kind}" style="border-left-color:var(--${v.stripe})">${v.body}
        <div class="kmove">${prev ? `<button class="icon-btn" data-act="kmove" data-kkind="${kind}" data-id="${x.id}" data-to="${prev.k}" aria-label="Mover para ${esc(prev.title)}" title="Mover para ${esc(prev.title)}">‹</button>` : "<span></span>"}
          ${v.open}${next ? `<button class="icon-btn" data-act="kmove" data-kkind="${kind}" data-id="${x.id}" data-to="${next.k}" aria-label="Mover para ${esc(next.title)}" title="Mover para ${esc(next.title)}">›</button>` : "<span></span>"}</div></article>`; }).join("")
      || `<p class="muted small kempty">${c.empty}</p>`}
    ${c.more ? `<p class="muted small kempty">+ ${c.more} mais antiga${c.more === 1 ? "" : "s"}</p>` : ""}</div></section>`).join("")}</div>`;
}
// cada coluna rola sozinha: a altura cabe na tela (sem mexer o resto do dash) e a posição da rolagem sobrevive às atualizações
const KSCROLL = {};
function kanbanFit() {
  const kb = document.querySelector(".kanban"); if (!kb) return;
  const abaixo = (parseFloat(getComputedStyle($("#view")).paddingBottom) || 0) + ($(".foot") ? $(".foot").offsetHeight : 0) + (parseFloat(getComputedStyle($(".app")).marginBottom) || 0); // rodapé e margem do quadro
  kb.style.setProperty("--kh", Math.max(340, innerHeight - (kb.getBoundingClientRect().top + scrollY) - abaixo - 6) + "px");
  kb.querySelectorAll(".kcol").forEach(c => { const b = c.querySelector(".kcol-b"), k = c.dataset.kkind + "|" + c.dataset.kcol; if (KSCROLL[k]) b.scrollTop = KSCROLL[k]; b.onscroll = () => { KSCROLL[k] = b.scrollTop; }; });
}
addEventListener("resize", kanbanFit);
async function kMove(kind, id, to) {
  const x = get(id); if (!x || x.status === to) return;
  if (kind === "error") {
    await put(Object.assign({}, x, { status: to, historico: (x.historico || []).concat([{ em: new Date().toISOString(), de: ESTATUS[x.status || "pendente"][0], para: ESTATUS[to][0] }]) }));
    toast("Erro movido para " + ESTATUS[to][0]);
  } else {
    await put(Object.assign({}, x, { status: to, concluidaEm: to === "concluida" ? x.concluidaEm || TODAY() : "" }));
    toast(to === "concluida" ? "Revisão concluída. Abra o card para registrar como foi." : "Revisão movida para " + RSTATUS[to][0]);
  }
  render();
}
// arrastar e soltar (computador); no celular e pelo teclado ficam os botões ‹ ›
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest(".kcard"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.kkind + "|" + c.dataset.kid); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest(".kcard"); if (c) c.classList.remove("dragging"); document.querySelectorAll(".kcol.over").forEach(x => x.classList.remove("over")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest(".kcol"); if (!col) return; e.preventDefault(); document.querySelectorAll(".kcol.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest(".kcol"); if (!col) return; e.preventDefault(); col.classList.remove("over");
  const [kind, id] = (e.dataTransfer.getData("text/plain") || "").split("|");
  if (kind === col.dataset.kkind && id) kMove(kind, id, col.dataset.kcol);
});

let ef = { disc: "", status: "", q: "", de: "", ate: "" };

    <div class="body"><div class="row" style="gap:6px"><b style="flex:1;min-width:0">${esc(e.assunto || "Assunto não informado")}</b>${chip(ESTATUS, e.status)}</div>

function vErros() {
  const head = `<div class="page-h"><div><span class="eyebrow">Caderno de erros</span><h1>O que errei e como corrigir</h1><p>Registre rápido, complete depois. Nenhum campo é obrigatório.</p></div><div class="row">${viewSeg("erros")}<button class="btn ghost" data-act="funil" data-v="erros" title="Personalizar as etapas do funil">${ic("weeks")}Etapas</button><button class="btn primary" data-act="new-error">${ic("plus")}Registrar erro</button></div></div>`;
  const es = errors();
  if (!es.length) return head + `<div class="card">${empty("err", "Nenhum erro registrado", "Quando errar uma questão, anote aqui o motivo e a explicação certa. Os assuntos com mais erros aparecem destacados para revisão.", `<button class="btn primary" data-act="new-error">Registrar o primeiro erro</button>`)}</div>`;
  const list = es.filter(e => (!ef.disc || e.disciplina === ef.disc) && (!ef.status || VIEW.erros === "kanban" || e.status === ef.status) && (!ef.q || ((e.assunto || "") + " " + (e.enunciado || "")).toLowerCase().includes(ef.q.toLowerCase())) && (!ef.de || e.data >= ef.de) && (!ef.ate || e.data <= ef.ate));
  const top = bySubject().filter(s => s.erros).sort((a, b) => b.erros - a.erros).slice(0, 6);

  if (VIEW.erros === "kanban") return head + `<div class="filters"><select id="efDisc">${opts(disciplinas(), ef.disc, "Todas as disciplinas")}</select><input id="efQ" placeholder="Buscar assunto" value="${esc(ef.q)}"><input type="date" id="efDe" value="${ef.de}" aria-label="De"><input type="date" id="efAte" value="${ef.ate}" aria-label="Até"></div>`
    + kanban("error", Object.entries(ESTATUS).map(([k, v]) => ({ k, title: v[0], cls: v[1], items: list.filter(e => (e.status || "pendente") === k || (k === "pendente" && !ESTATUS[e.status])), empty: "Nenhum erro aqui." })), e => ({
      stripe: corEtapa(ESTATUS, e.status || "pendente")[1],
      body: `<b>${esc(e.assunto || "Assunto não informado")}</b><p>${esc(e.disciplina || "—")} · ${fmtD(e.data)}${e.categoria ? " · " + esc(e.categoria) : ""}</p>`,
      open: `<button class="btn sm ghost" data-act="edit-error" data-id="${e.id}">Abrir</button>` }));
  return head + `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>Assuntos com mais erros</h2></div>${hbars(top.map(t => ({ l: t.assunto, p: t.erros / maxE * 100, v: t.erros })))}</div>
    <div class="card"><div class="card-h"><h2>Por motivo</h2><p>${es.filter(e => e.status !== "corrigido").length} ainda sem correção</p></div>${cats.length ? hbars(cats.map(c => ({ l: c.l, p: c.n / es.length * 100, v: c.n }))) : `<p class="muted small">Classifique o motivo dos erros para ver o padrão.</p>`}</div></div>
    <div class="filters"><select id="efDisc">${opts(disciplinas(), ef.disc, "Todas as disciplinas")}</select><select id="efStatus">${opts(Object.entries(ESTATUS).map(([k, v]) => [k, v[0]]), ef.status, "Todos os status")}</select><input id="efQ" placeholder="Buscar assunto" value="${esc(ef.q)}"><input type="date" id="efDe" value="${ef.de}" aria-label="De"><input type="date" id="efAte" value="${ef.ate}" aria-label="Até"></div>
    <div class="list">${list.map(errItem).join("") || `<div class="card"><p class="muted">Nenhum erro com esses filtros.</p></div>`}</div>`;

let pf = { week: "", disc: "", q: "", ord: "pior" };
const accCls = a => a == null ? "" : a >= 80 ? "ok" : a >= 70 ? "and" : "bad";
const accCor = a => a == null ? "var(--ink-3)" : a >= 80 ? "var(--ok)" : a >= 70 ? "var(--warn)" : "var(--bad)";
const barCor = (p, cor) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, p || 0))}%;background:${cor}"></i></div>`;
const FAIXAS = [["Abaixo de 50%", 0, 50, "var(--bad)"], ["De 50% a 69%", 50, 70, "color-mix(in srgb,var(--bad) 55%,var(--warn))"], ["De 70% a 79%", 70, 80, "var(--warn)"], ["80% ou mais", 80, 101, "var(--ok)"]];
const PF_ORD = [["pior", "Pior acerto primeiro"], ["melhor", "Melhor acerto primeiro"], ["mais", "Mais questões"], ["az", "Ordem alfabética"], ["plano", "Ordem do cronograma"]];
// números da aba (e do relatório) para um filtro { week, disc, q, ord }
function desempDados(f) {
  const ws = weeks(), widx = new Map(ws.map((w, i) => [w.id, i]));
  const base = contents().filter(c => +c.qResolvidas > 0);
  const casa = c => (!f.disc || c.disciplina === f.disc) && (!f.q || ((c.assunto || "") + " " + (c.disciplina || "")).toLowerCase().includes(f.q.toLowerCase()));
  const linha = c => { const qr = +c.qResolvidas, qc = Math.min(qr, +c.qCorretas || 0); return { c, qr, qc, acc: pct1(qc, qr), w: get(c.weekId) }; };
  const rows = base.filter(c => casa(c) && (!f.week || c.weekId === f.week)).map(linha);
  const soma = xs => { const qr = xs.reduce((a, x) => a + x.qr, 0), qc = xs.reduce((a, x) => a + x.qc, 0); return { qr, qc, acc: pct1(qc, qr) }; };
  const discs = [...new Set(rows.map(x => x.c.disciplina || "—"))].map(d => { const xs = rows.filter(x => (x.c.disciplina || "—") === d); return Object.assign({ d, n: xs.length }, soma(xs)); }).sort((a, b) => (a.acc ?? 0) - (b.acc ?? 0));
  const semanas = ws.map((w, i) => Object.assign({ w, lbl: "S" + (i + 1) }, soma(base.filter(c => casa(c) && c.weekId === w.id).map(linha))));
  const faixas = FAIXAS.map(([l, de, ate, cor]) => ({ l, cor, n: rows.filter(x => x.acc >= de && x.acc < ate).length }));
  const ord = { pior: (a, b) => a.acc - b.acc || b.qr - a.qr, melhor: (a, b) => b.acc - a.acc || b.qr - a.qr, mais: (a, b) => b.qr - a.qr, az: (a, b) => (a.c.assunto || "").localeCompare(b.c.assunto || "", "pt-BR"), plano: (a, b) => (widx.get(a.c.weekId) ?? 999) - (widx.get(b.c.weekId) ?? 999) }[f.ord] || (() => 0);
  return { base, rows: rows.slice().sort(ord), discs, tot: soma(rows), semanas, faixas, att: rows.filter(x => x.acc < 70).sort((a, b) => a.acc - b.acc) };
}
const faixaBar = fx => { const t = fx.reduce((a, x) => a + x.n, 0) || 1; return `<div class="fx-bar" role="img" aria-label="${fx.map(x => `${x.l}: ${x.n}`).join(", ")}">${fx.filter(x => x.n).map(x => `<i style="width:${x.n / t * 100}%;background:${x.cor}" title="${x.l}: ${x.n}"></i>`).join("")}</div>
  <ul class="fx-leg">${fx.map(x => `<li><i style="background:${x.cor}"></i><span>${x.l}</span><b class="num">${x.n}</b><em class="num">${Math.round(x.n / t * 100)}%</em></li>`).join("")}</ul>`; };
const discBars = discs => discs.map(d => `<div class="hb acc"><span class="lbl" title="${esc(d.d)}">${esc(d.d)}<small>${d.qc}/${d.qr} questões</small></span>${barCor(d.acc, accCor(d.acc))}<span class="v"><span class="chip ${accCls(d.acc)}">${fmtPct(d.acc)}</span></span></div>`).join("");

function baixaCsv(D, f) {
  const q = v => { v = String(v ?? ""); return /[";\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const num = v => v == null ? "" : v.toLocaleString("pt-BR", { maximumFractionDigits: 1 });

    .concat(D.rows.map(x => [x.c.disciplina, x.c.assunto, x.w ? x.w.nome : "", x.w && x.w.inicio ? fmtD(x.w.inicio) + "–" + fmtD(x.w.fim) : "", x.qr, x.qc, x.qr - x.qc, num(x.acc)]))

  const blob = new Blob(["﻿" + linhas.map(l => l.map(q).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });

const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const hexMix = (a, b, t) => "#" + rgb(a).map((x, i) => Math.round(x + (rgb(b)[i] - x) * t).toString(16).padStart(2, "0")).join("");

async function fotoPerfil(f) {
  if (!f || !/^image\/(png|jpeg|webp)$/.test(f.type)) { toast("Escolha uma imagem JPG, PNG ou WebP"); return; }
  try {
    const bmp = await createImageBitmap(f), q = Math.min(bmp.width, bmp.height), cv = document.createElement("canvas"); cv.width = cv.height = 256;
    cv.getContext("2d").drawImage(bmp, (bmp.width - q) / 2, (bmp.height - q) / 2, q, q, 0, 0, 256, 256); // recorte quadrado no centro
    const blob = await toBlob(cv, "image/webp", .88), path = `${S.user.id}/perfil-${Date.now()}.${blob.type === "image/webp" ? "webp" : "png"}`;
    const r = await sb.storage.from("mapas").upload(path, blob, { contentType: blob.type }); if (r.error) throw r.error;
    const old = perfil().foto; await salvaSettings({ perfil: Object.assign(perfil(), { foto: path }) });
    if (old) sb.storage.from("mapas").remove([old]).catch(() => { });
    toast("Foto atualizada"); render();
  } catch (e) { toast("Não consegui enviar a foto. Verifique a internet e tente de novo."); }
}
async function corEscolhida(el, salvar) {
  const k = el.dataset.cor, v = el.value, base = aparencia();
  if ((k === "bg" || k === "card") && !darkNow() && lum(v) < .45) { toast("Cor escura demais para fundo/cartões: o texto ficaria ilegível. Para fundo escuro, use o tema escuro."); el.value = coresDe(base)[k]; apRascunho = null; aplicaAparencia(); return; }
  apRascunho = { paleta: base.paleta, cores: Object.assign(coresDe(base), { [k]: v }) }; aplicaAparencia();
  if (salvar) { const ap = apRascunho; apRascunho = null; const pr = salvaSettings({ aparencia: ap }); render(); toast("Aparência salva"); await pr.catch(() => { }); }
}

// meta da semana = meta do dia útil × dias úteis + meta do fim de semana × dias de fim de semana (como na planilha: 8h × 5 = 40h)
function diasEstudo(w) {
  if (!w || !w.inicio || !w.fim) return 5;
  let n = 0; for (let d = w.inicio; d <= w.fim; d = addDays(d, 1)) { const k = new Date(d + "T12:00:00").getDay(); if (k > 0 && k < 6) n++; }
  return n || 5;
}
function diasFds(w) {
  if (!w || !w.inicio || !w.fim) return 2;
  let n = 0; for (let d = w.inicio; d <= domingoDe(w.fim); d = addDays(d, 1)) if (isFds(d)) n++;
  return n;
}
const fmtH = h => (Math.round(h * 100) / 100).toLocaleString("pt-BR") + "h";

  return `<div class="card"><div class="card-h"><div><h2>Dias úteis × fim de semana</h2><p>${esc(w.nome)}${w.inicio ? ` · ${fmtD(w.inicio)} a ${fmtD(domingoDe(w.fim))}` : ""} · total ${hm(st.min)}${st.meta ? ` de ${hm(st.meta)}` : ""}</p></div><button class="btn sm ghost" data-act="hours-config" data-week="${w.id}">Ajustar metas</button></div>
    <div class="split">${row("Dias úteis", "seg a sex", st.minUteis, st.metaUteis, "")}${row("Fim de semana", "sáb e dom", st.minFds, st.metaFds, "fds")}</div></div>`;
}

async function uploadFile(file, cid, replaceId) {
  if (!file || !S.assets) return;
  toast("Enviando " + file.name + "…");
  try {
    const r = await S.assets.upload(file);
    const old = replaceId ? get(replaceId) : null;
    await put({ id: replaceId || uid("mt"), kind: "material", contentId: cid, nome: file.name, url: r.url, assetId: r.id, tipo: "Arquivo " + (file.name.split(".").pop() || "").toUpperCase(), contentType: r.contentType, tamanho: r.sizeBytes, arquivo: true });
    if (old && old.assetId) { try { await S.assets.delete(old.assetId); } catch (e) { } }
    toast("Arquivo anexado"); contentForm(get(cid));
  } catch (e) {
    const m = { unsupported_type: "Esse tipo de arquivo não pode ser guardado aqui. Envie em PDF ou vincule pelo Google Drive.", too_large: "Arquivo acima de 20 MB. Envie uma versão menor ou vincule pelo Drive.", not_uploader: "Só quem edita a página pode anexar arquivos.", quota_or_state: "Espaço de anexos cheio. Remova arquivos antigos." }[e && e.code];
    toast(m || "Não consegui enviar o arquivo. Tente de novo.");
  }
}

/* ================= importação de planilha ================= */
function importFlow() {
  openDrawer("Importar planilha", `<div class="sect"><p>Envie a planilha de acompanhamento (.xlsx ou .csv). Cada aba vira uma semana e as linhas com disciplina e assunto viram conteúdos. Você confere tudo antes de importar, e a planilha original não é alterada.</p>
    <div><button class="btn primary" id="pickX">${ic("upload")}Escolher arquivo</button></div><div id="impOut"></div></div>`, "");
  $("#pickX").onclick = () => { $("#xlsIn").value = ""; $("#xlsIn").click(); };
  $("#xlsIn").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    if (!window.XLSX) { $("#impOut").innerHTML = `<p class="err">O leitor de planilhas não carregou. Atualize a página e tente de novo.</p>`; return; }
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array", cellDates: true });
    const found = []; const issues = [];
    const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
    wb.SheetNames.forEach(name => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
      let hi = rows.findIndex(r => r.some(c => /disciplina|materia/.test(norm(c))) && r.some(c => /assunto|conteudo|topico/.test(norm(c))));
      if (hi < 0) { issues.push(`Aba “${name}”: não encontrei colunas de disciplina e assunto.`); return; }
      const h = rows[hi].map(norm);
      const col = re => h.findIndex(c => re.test(c));
      const cD = col(/disciplina|materia/), cA = col(/assunto|conteudo|topico/), cS = col(/status|situacao|concluid/), cQ = col(/resolvid|feitas|questoes/), cC = col(/acert|corret/), cL = col(/link|material|url/), cO = col(/obs/);
      const items = [];
      let lastD = "";
      for (let i = hi + 1; i < rows.length; i++) {
        const r = rows[i]; const first = norm(r.find(x => String(x).trim()));
        if (/fechamento/.test(first)) break;
        const d = String(r[cD] || "").trim() || lastD, a = String(r[cA] || "").trim();
        if (!a) continue; lastD = d;
        const sv = cS >= 0 ? norm(r[cS]) : "";
        items.push({ disciplina: d, assunto: a, status: /conclu|ok|sim|true|feito|x/.test(sv) ? "concluido" : /andamento/.test(sv) ? "andamento" : "pendente", qResolvidas: cQ >= 0 && r[cQ] !== "" ? +r[cQ] || null : null, qCorretas: cC >= 0 && r[cC] !== "" ? +r[cC] || null : null, link: cL >= 0 ? String(r[cL] || "").trim() : "", obs: cO >= 0 ? String(r[cO] || "") : "" });
      }
      if (items.length) found.push({ name, items }); else issues.push(`Aba “${name}”: cabeçalho encontrado, mas nenhuma linha de assunto.`);
    });
    issues.push("Hiperlinks embutidos em texto e fórmulas não são lidos; confira os links depois da importação.");
    const total = found.reduce((a, s) => a + s.items.length, 0);
    $("#impOut").innerHTML = `<div class="sect" style="margin-top:12px"><h3>Encontrei ${found.length} semanas e ${total} conteúdos em “${esc(f.name)}”</h3>
      ${issues.map(i => `<p class="small muted">• ${esc(i)}</p>`).join("")}
      ${found.map(s => `<details class="card" style="padding:12px;box-shadow:none;border:1px solid var(--line)"><summary><b>${esc(s.name)}</b> · ${s.items.length} conteúdos</summary><div class="tbl-wrap"><table><thead><tr><th>Disciplina</th><th>Assunto</th><th>Status</th><th class="n">Q</th></tr></thead><tbody>${s.items.map(x => `<tr><td>${esc(x.disciplina)}</td><td>${esc(x.assunto)}</td><td>${STATUS[x.status][0]}</td><td class="n">${x.qResolvidas ?? ""}</td></tr>`).join("")}</tbody></table></div></details>`).join("")}
      ${total ? `<div><button class="btn primary" id="doImp">Importar ${total} conteúdos</button></div>` : ""}</div>`;
    const b = $("#doImp"); if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = "Importando…";
      let ord = weeks().length;
      for (const s of found) {
        const w = { id: uid("wk"), kind: "week", nome: s.name, ordem: ++ord, inicio: "", fim: "", metaHoras: null, importado: f.name };
        await put(w);
        let o = 0;
        for (const x of s.items) {
          const c = { id: uid("ct"), kind: "content", weekId: w.id, ordem: ++o, disciplina: x.disciplina, assunto: x.assunto, status: x.status, qResolvidas: x.qResolvidas, qCorretas: x.qCorretas, obs: x.obs, concluidaEm: x.status === "concluido" ? TODAY() : "" };
          await put(c);
          if (/^https?:\/\//.test(x.link)) await put({ id: uid("mt"), kind: "material", contentId: c.id, nome: "Material", url: x.link, tipo: /docs\.google\.com\/document/.test(x.link) ? "Google Docs" : /spreadsheets/.test(x.link) ? "Google Sheets" : "Site", arquivo: false });
        }
      }
      closeDrawer(); toast("Importação concluída. Defina o período e a meta de cada semana."); go("crono");
    };
  };
}

}

/* ================= exemplo ================= */
async function seedExample() {
  const t = TODAY(); const mon = addDays(t, -((new Date(t + "T12:00").getDay() + 6) % 7) - 14);
  const plan = [
    ["Língua Portuguesa", ["Ortografia e acentuação", "Classes de palavras", "Concordância verbal e nominal", "Regência e crase"]],
    ["Direito Constitucional", ["Princípios fundamentais", "Direitos e garantias fundamentais", "Organização do Estado"]],
    ["Raciocínio Lógico", ["Proposições e conectivos", "Equivalências lógicas"]],
    ["Direito Administrativo", ["Princípios da Administração", "Atos administrativos", "Licitações"]],
  ];
  const docs = []; const E = { exemplo: true };
  const W = [0, 1, 2].map(i => ({ id: uid("wk"), kind: "week", nome: "Semana " + (i + 1), ordem: i + 1, inicio: addDays(mon, i * 7), fim: addDays(mon, i * 7 + 6), metaHoras: 25, ...E }));
  docs.push(...W);
  const st = [[1, 1, 1, 1, 1, 1], [1, 1, 1, .5, 0, 0], [.5, 0, 0, 0, 0]];
  let k = 0;
  const flat = plan.flatMap(([d, as]) => as.map(a => [d, a]));
  const per = [flat.slice(0, 4), flat.slice(4, 8), flat.slice(8, 12)];
  const cs = [];
  per.forEach((arr, wi) => arr.forEach(([d, a], j) => {
    const s = st[wi][j] ?? 0; const status = s === 1 ? "concluido" : s ? "andamento" : "pendente";
    const qr = s ? [20, 30, 15, 25, 18, 22][(k++) % 6] : null;
    const qc = qr ? Math.round(qr * [0.85, 0.6, 0.75, 0.9, 0.55, 0.8][k % 6]) : null;
    const c = { id: uid("ct"), kind: "content", weekId: W[wi].id, ordem: j + 1, disciplina: d, assunto: a, status, prevista: addDays(W[wi].inicio, j), concluidaEm: status === "concluido" ? addDays(W[wi].inicio, j + 1) : "", qResolvidas: qr, qCorretas: qc, revisar: qc && qc / qr < .7, obs: "", ...E };
    cs.push(c); docs.push(c);
  }));
  W.forEach((w, wi) => [0, 1, 2, 3, 4].forEach(dd => { const day = addDays(w.inicio, dd); if (day > t) return; const c = cs.filter(x => x.weekId === w.id)[dd % 4]; docs.push({ id: uid("ss"), kind: "session", data: day, inicio: "08:00", fim: wi === 2 ? "12:00" : "13:30", pausasMin: 15, almoco: false, contentId: c.id, disciplina: c.disciplina, ...E }); }));
  const er = (c, cat, st2, exp) => ({ id: uid("er"), kind: "error", contentId: c.id, disciplina: c.disciplina, assunto: c.assunto, data: c.prevista, questao: "Questão de exemplo", categoria: cat, status: st2, explicacao: exp, ...E });
  docs.push(er(cs[1], "Confusão entre conceitos", "pendente", "Exemplo: advérbio modifica verbo, adjetivo ou outro advérbio; adjetivo modifica substantivo."));
  docs.push(er(cs[1], "Desatenção", "revisao", "Exemplo: o enunciado pedia a alternativa incorreta."));
  docs.push(er(cs[5], "Dúvida sobre legislação", "corrigido", "Exemplo: conferir o artigo exato na Constituição."));
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[1].assunto, disciplina: cs[1].disciplina, prevista: t, motivo: "Erro: confusão entre conceitos", origem: "erro", status: "pendente", ...E });
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[0].assunto, disciplina: cs[0].disciplina, prevista: addDays(t, -2), motivo: "Conteúdo concluído", origem: "conteudo", status: "pendente", ...E });
  docs.push({ id: uid("rv"), kind: "review", assunto: cs[4].assunto, disciplina: cs[4].disciplina, prevista: addDays(t, 5), motivo: "Revisão de 7 dias", origem: "conteudo", status: "pendente", ...E });
  docs.push({ id: uid("mt"), kind: "material", contentId: cs[0].id, nome: "Resumo de acentuação (exemplo)", url: "https://docs.google.com/document/d/exemplo", tipo: "Google Docs", arquivo: false, ...E });
  docs.push({ id: "cl_" + W[0].id, kind: "closing", weekId: W[0].id, dificuldades: "Exemplo: classes de palavras exigiram mais tempo do que o previsto.", reforcar: "Classes de palavras", observacoes: "", prioridades: "Exemplo: resolver 30 questões de Constitucional.", finalizadaEm: addDays(W[0].fim, 0) + "T20:00:00.000Z", ...E });
  for (const d of docs) await put(d);
  toast("Exemplo carregado"); render();
}
async function clearExample() {
  if (!(await confirmBox("Apagar os dados de exemplo?", "Somente os registros marcados como exemplo serão apagados. O que você cadastrou continua.", "Apagar exemplos"))) return;

/* ================= check animado ================= */
async function toggleContent(btn) {
  const c = get(btn.dataset.id); if (!c) return;
  const done = c.status !== "concluido";
  const row = btn.closest(".citem");
  btn.classList.remove("no-anim");
  animLock = true;
  if (done) { btn.classList.add("on", "pop"); row && row.classList.add("done"); }
  else { btn.classList.remove("on", "pop"); row && row.classList.remove("done"); }
  btn.setAttribute("aria-pressed", done);
  const rec = Object.assign({}, c, { status: done ? "concluido" : (c.status === "concluido" ? "andamento" : c.status), concluidaEm: done ? TODAY() : "" });
  const p = put(rec);
  // atualiza barras e topo imediatamente
  const o = overall(); $("#ovBar").style.width = o.pct + "%"; $("#ovTxt").textContent = `${Math.round(o.pct)}% do plano · ${o.done}/${o.total}`;
  setTimeout(() => { animLock = false; if (pendingSnap) { const s = pendingSnap; pendingSnap = null; applySnap(s); } else render(); }, 750);
  try { await p; if (done) toast("Concluído · " + (c.assunto || "")); } catch (e) { }
}
